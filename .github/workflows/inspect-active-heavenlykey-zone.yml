name: Inspect active Heavenly Key DNS zone ownership
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-active-heavenlykey-zone.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    steps:
      - name: Compare Cloudflare zone delegation with public DNS
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          if(!process.env.CF_TOKEN){console.log('NO PRODUCTION TOKEN AVAILABLE');process.exit(0)}
          const response=await fetch('https://api.cloudflare.com/client/v4/zones?name=heavenlykey.org',{headers:{authorization:'Bearer '+process.env.CF_TOKEN},signal:AbortSignal.timeout(15000)});
          const json=await response.json();
          if(!response.ok||!json.success){console.log('ZONE READ DENIED',response.status,(json.errors||[]).map(x=>x.code));process.exit(0)}
          for(const zone of json.result||[]) console.log(JSON.stringify({name:zone.name,status:zone.status,accountName:zone.account?.name||'',accountId:zone.account?.id||'',nameServers:zone.name_servers||[]}));
          JS
