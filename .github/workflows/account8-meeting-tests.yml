name: Account 8 Meeting Space CI
on:
  pull_request:
    paths:
      - 'zoom-studio/**'
      - '.github/workflows/account8-meeting-tests.yml'
  workflow_dispatch:
jobs:
  meeting-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: zoom-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --ignore-scripts; fi
      - name: Run Account 8 test suite
        run: npm test
