name: Verify Signed Account 5 Android Release on Emulator
on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: 'Successful production-approved signed Android release workflow run ID'
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  signed-apk-install:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 29, 35]
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_RUN: ${{ inputs.release_run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Require successful signed release from the same repository
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_RUN" =~ ^[1-9][0-9]{5,15}$ ]] || exit 1
          info="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN")"
          test "$(jq -r '.conclusion' <<<"$info")" = success
          test "$(jq -r '.event' <<<"$info")" = workflow_dispatch
          test "$(jq -r '.head_branch' <<<"$info")" = main
          test "$(jq -r '.head_repository.full_name' <<<"$info")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.name' <<<"$info")" = 'Package Account 5 Signed Android Release'
      - name: Fetch exact approved signed APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signed-release"
          gh run download "$RELEASE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name heavenly-key-account5-signed-android-release --dir "$RUNNER_TEMP/signed-release"
          mapfile -d '' apks < <(find "$RUNNER_TEMP/signed-release" -type f -name 'app-release.apk' -print0)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          test -s "$apk" && test -s "$apk.sha256"
          actual="$(sha256sum "$apk" | cut -d ' ' -f 1)"
          expected="$(awk 'NR==1 {print $1}' "$apk.sha256")"
          test "$actual" = "$expected" || { echo '::error::Signed APK checksum mismatch'; exit 1; }
          echo "SIGNED_APK=$apk" >> "$GITHUB_ENV"
      - name: Install signed APK, verify launch and test app home on Android ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r "$SIGNED_APK"
            adb shell pm path org.heavenlykey.apps | grep -q package:
            adb shell am start -W -n org.heavenlykey.apps/.MainActivity
            sleep 8
            adb shell pidof org.heavenlykey.apps | grep -Eq '[0-9]+'
            adb shell dumpsys activity activities | grep -q org.heavenlykey.apps
      - name: Test scope
        run: |
          echo 'SIGNED APK installation and foreground launch verified on Android emulator.'
          echo 'Production release, Play Store publication and real-device testing still require separate approval.'
