name: Audit public footers and unofficial widgets
on:
  push:
    branches: [main]
    paths: ['config/approved-homepage-footer.json', 'scripts/cleanup/**', 'tests/approved-footer.mjs', '.github/workflows/audit-public-cleanup.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/cleanup/sync-footer.mjs && node tests/approved-footer.mjs
      - name: Verify published shared footer assets
        run: |
          node scripts/cleanup/verify-footer-live.mjs https://apps.heavenlykey.org
          node scripts/cleanup/verify-footer-live.mjs https://global.heavenlykey.org
          node scripts/cleanup/verify-footer-live.mjs https://onlinebible.heavenlykey.org shared/
          node scripts/cleanup/verify-footer-live.mjs https://heavenlykey-public-assistant.heavenlykeyapp.workers.dev
      - run: node scripts/cleanup/audit-public.mjs
