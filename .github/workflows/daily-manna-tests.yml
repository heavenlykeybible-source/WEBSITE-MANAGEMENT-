name: Daily Manna checks
on:
  push:
    paths:
      - 'apps/daily-manna/**'
      - '.github/workflows/daily-manna-tests.yml'
  pull_request:
    paths:
      - 'apps/daily-manna/**'
      - '.github/workflows/daily-manna-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/daily-manna
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Worker syntax
        run: node --check worker.mjs
      - name: Validate editor and schema
        run: node tests.mjs
      - name: Validate owner proxy
        run: node adapter-tests.mjs
      - name: Validate public page
        run: node public-page.test.mjs
      - name: Validate request limits and authentication
        run: node request-validation.test.mjs

      - name: Validate picture upload and retrieval
        run: node picture.test.mjs

      - name: Validate public devotional archive privacy and pagination
        run: node archive.test.mjs

      - name: Validate authorized Facebook Page publishing adapter
        run: node facebook-publisher.test.mjs

      - name: Validate social queue delivery and duplicate protection
        run: node facebook-dispatch.test.mjs

      - name: Validate published correction history and stale-write protection
        run: node correction-history.test.mjs

      - name: Validate signed central Studio handoff
        run: node studio-bridge.test.mjs
