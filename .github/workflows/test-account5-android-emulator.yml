name: Test Account 5 Android APK on Emulator
on:
  workflow_dispatch:
  push:
    paths:
      - 'heavenly-key-accounts/account-05-heavenly-key-app/native/android/**'
      - '.github/workflows/test-account5-android-emulator.yml'
permissions:
  contents: read
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 29]
    defaults:
      run:
        working-directory: heavenly-key-accounts/account-05-heavenly-key-app/native/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdk_tool="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdk_tool" && test -x "$sdk_tool"
          "$sdk_tool" --sdk_root="$sdk_root" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile test APK and check Android lint
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon
      - name: Enable KVM access for emulator
        run: |
          if test -e /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
      - name: Install and launch on Android API ${{ matrix.api-level }} emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          script: |
            set -e
            adb install -r heavenly-key-accounts/account-05-heavenly-key-app/native/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path org.heavenlykey.apps | grep -q package:
            adb shell am start -W -n org.heavenlykey.apps/.MainActivity
            sleep 5
            adb shell pidof org.heavenlykey.apps | grep -Eq '[0-9]+'
      - name: Explain test scope
        run: |
          echo "Emulator smoke test verifies APK installation and process launch on Android API ${{ matrix.api-level }}."
          echo "It is NOT production signing, a physical-device test, or confirmation of live website content."
