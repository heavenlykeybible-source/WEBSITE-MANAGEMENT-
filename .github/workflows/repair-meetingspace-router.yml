name: Repair MeetingSpace public router
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-meetingspace-router.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: heavenlykey-portal-routing
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Preserve existing router and connect dedicated MeetingSpace Worker
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          const token=process.env.CF_TOKEN,base='https://api.cloudflare.com/client/v4/accounts/a160ba9fc74911bd4b3005eac86eefcb/workers/scripts/heavenlykey-portals';
          async function api(path,init={}){const r=await fetch(base+path,{...init,headers:{authorization:'Bearer '+token},signal:AbortSignal.timeout(20000)});return r}
          const settingsResponse=await api('/settings'),settingsJson=await settingsResponse.json();assert.ok(settingsResponse.ok&&settingsJson.success,'Router settings access required');const settings=settingsJson.result;
          const r=await api('');assert.ok(r.ok,'Router source access required');let modules=[];
          if((r.headers.get('content-type')||'').includes('multipart/form-data')){const form=await r.formData();for(const [name,v]of form)if(name!=='metadata')modules.push({name,text:typeof v==='string'?v:await v.text(),type:v.type||'application/javascript+module'})}else modules=[{name:'worker.mjs',text:await r.text(),type:'application/javascript+module'}];
          const entries=modules.filter(x=>x.text.includes('const targets = Object.freeze({'));assert.equal(entries.length,1);const entry=entries[0],source=entry.text;
          writeFileSync('router-before.mjs',source);
          const host='meetingspace.heavenlykey.org',origin='https://heavenly-key-meetingspace.omegawealthcreator.workers.dev';
          const root=await fetch(origin+'/');assert.equal(root.status,200);await root.body.cancel();
          const matcher=/'meetingspace\.heavenlykey\.org'\s*:\s*'[^']+'/;
          let changed=matcher.test(source)?source.replace(matcher,"'"+host+"': '"+origin+"'"):source.replace('const targets = Object.freeze({',"const targets = Object.freeze({\n  '"+host+"': '"+origin+"',");
          const mod=await import('data:text/javascript;base64,'+Buffer.from(changed).toString('base64'));
          for(const method of ['GET','POST']){let called=false;await mod.route(new Request('https://'+host+'/api/test?q=1',{method,headers:{Origin:'https://'+host,Cookie:'session=test'},...(method==='POST'?{body:'{}'}:{})}),async req=>{called=true;assert.equal(req.url,origin+'/api/test?q=1');assert.equal(req.headers.get('Origin'),origin);assert.equal(req.headers.get('Cookie'),'session=test');return new Response('ok')});assert.ok(called)}
          assert.equal((await mod.route(new Request('https://'+host+'/api/test',{method:'POST',headers:{Origin:'https://unrelated.example'}}),()=>{throw Error('Must not forward')})).status,403);
          console.log('PASS routing and authentication boundary tests');
          if(changed!==source){const metadata={main_module:entry.name,compatibility_date:settings.compatibility_date,compatibility_flags:settings.compatibility_flags||[],keep_bindings:[...new Set((settings.bindings||[]).map(x=>x.type))],keep_assets:true};for(const k of ['logpush','observability','tail_consumers','limits','placement','tags'])if(settings[k]!==undefined)metadata[k]=settings[k];const form=new FormData();form.set('metadata',new Blob([JSON.stringify(metadata)],{type:'application/json'}));for(const m of modules)form.set(m.name,new Blob([m===entry?changed:m.text],{type:m.type}),m.name);const response=await api('',{method:'PUT',body:form}),data=await response.json();assert.ok(response.ok&&data.success,'Router update failed');console.log('PASS MeetingSpace mapping deployed')}
          for(const h of ['meetingspace.heavenlykey.org','mediaguru.heavenlykey.org','socialplus.heavenlykey.org'])for(const path of ['/','/api/health']){const response=await fetch('https://'+h+path,{cache:'no-store',signal:AbortSignal.timeout(15000)});console.log('PUBLIC',h,path,response.status,(response.headers.get('content-type')||'').includes('json')?await response.text():'');if(h===host&&path==='/')assert.equal(response.status,200)}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meetingspace-router-before
          path: router-before.mjs
          if-no-files-found: ignore
