name: Deploy Account 7 Heavenly Key Radio
on:
  workflow_dispatch:
  push:
    branches: [prepare/account-07-radio-20261023]
    paths:
      - 'heavenly-key-accounts/account-07-unverified/source/**'
jobs:
  deploy-radio:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out approved Radio release
        uses: actions/checkout@v4
        with:
          ref: prepare/account-07-radio-20261023
      - name: Verify Radio files
        run: |
          test -f heavenly-key-accounts/account-07-unverified/source/index.html
          test -f heavenly-key-accounts/account-07-unverified/source/_worker.js
          test -f heavenly-key-accounts/account-07-unverified/source/js/approved-widget-system.js
          test -f heavenly-key-accounts/account-07-unverified/source/css/radio-approved-number-one.css
      - name: Deploy Radio directly to Cloudflare Pages
        working-directory: heavenly-key-accounts/account-07-unverified/source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_RADIO_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_RADIO_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_RADIO_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_RADIO_ACCOUNT_ID"; exit 1; }
          npx --yes wrangler@4 pages deploy . --project-name heavenly-key-radio --branch main
