name: Deploy Account 7 Heavenly Key Radio
on:
  workflow_dispatch:
  push:
    branches: [prepare/account-07-radio-20261023]
    paths:
      - 'heavenly-key-accounts/account-07-unverified/**'
      - '.github/workflows/deploy-account-07-radio.yml'
      - 'tests/account7-radio.mjs'
      - 'tests/account2-radio.mjs'
permissions:
  contents: read
concurrency:
  group: account7-radio-production
  cancel-in-progress: false
jobs:
  deploy-radio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Radio release
        uses: actions/checkout@v4
        with:
          ref: prepare/account-07-radio-20261023
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test repository and Radio playback
        run: |
          node tests/run.mjs
          node --experimental-vm-modules tests/account7-radio.mjs
          node --experimental-strip-types tests/account2-radio.mjs
      - name: Verify existing Account 7 Worker access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_RADIO_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_RADIO_ACCOUNT_ID }}
        run: node heavenly-key-accounts/account-07-unverified/scripts/preflight.mjs
      - name: Deploy Radio directly to existing Account 7 Worker
        working-directory: heavenly-key-accounts/account-07-unverified/source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_RADIO_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_RADIO_ACCOUNT_ID }}
        run: npx --yes wrangler@4.152.0 deploy --config wrangler.toml --keep-vars
      - name: Verify deployed Radio and Account 2 programme
        run: node heavenly-key-accounts/account-07-unverified/scripts/verify-live.mjs https://heavenlykeyradio.heavenlykeyradio.workers.dev
