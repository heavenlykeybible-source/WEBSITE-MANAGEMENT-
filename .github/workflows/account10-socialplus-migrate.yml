name: Account 10 approved database migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: socialplus-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: socialplus-production
    defaults:
      run:
        working-directory: account10-social-management
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ACCOUNT10_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT10_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install verified dependencies
        run: npm ci --no-audit --no-fund
      - name: Confirm existing database baseline
        run: npx wrangler d1 execute heavenlykey-social-management-db --remote --command "SELECT COUNT(*) AS total FROM social_posts"
      - name: Check whether media column already exists
        id: media_schema
        run: |
          npx wrangler d1 execute heavenlykey-social-management-db --remote --json --command "SELECT name FROM pragma_table_info('social_posts') WHERE name='media_id'" > media-schema.json
          node -e "const fs=require('node:fs');const d=JSON.parse(fs.readFileSync('media-schema.json','utf8'));if(!Array.isArray(d)||!Array.isArray(d[0]?.results))process.exit(1);fs.appendFileSync(process.env.GITHUB_OUTPUT,'already_applied='+(d[0].results.length?'true':'false')+'\\n')"
      - name: Apply post-media migration only if missing
        if: steps.media_schema.outputs.already_applied == 'false'
        run: npx wrangler d1 execute heavenlykey-social-management-db --remote --file=migrations/0007_post_media.sql
      - name: Confirm new media column
        run: npx wrangler d1 execute heavenlykey-social-management-db --remote --command "SELECT media_id FROM social_posts LIMIT 1"
