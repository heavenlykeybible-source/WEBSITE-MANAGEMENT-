name: Account 5 - Strength for Today quality audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/heavenly-key-bible/bible/tests/audit-strength-five-years.mjs'
      - 'apps/heavenly-key-bible/heavenly-key-website/bible/strength-devotionals-*.json'
      - 'apps/heavenly-key-bible/heavenly-key-website/bible/strength-publication-status.json'
      - '.github/workflows/account5-strength-devotional-audit.yml'
permissions:
  contents: read
jobs:
  editorial-quality-gate:
    name: Editorial quality gate (not doctrinal approval)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check audit script syntax
        run: node --check apps/heavenly-key-bible/bible/tests/audit-strength-five-years.mjs
      - name: Audit all devotional JSON data (read-only)
        run: node apps/heavenly-key-bible/bible/tests/audit-strength-five-years.mjs
