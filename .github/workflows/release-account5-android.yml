name: Package Account 5 Signed Android Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-release
    defaults:
      run:
        working-directory: heavenly-key-accounts/account-05-heavenly-key-app/native/android
    env:
      HKEM_ANDROID_KEYSTORE_BASE64: ${{ secrets.HKEM_ANDROID_KEYSTORE_BASE64 }}
      HKEM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HKEM_ANDROID_KEYSTORE_PASSWORD }}
      HKEM_ANDROID_KEY_ALIAS: ${{ secrets.HKEM_ANDROID_KEY_ALIAS }}
      HKEM_ANDROID_KEY_PASSWORD: ${{ secrets.HKEM_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 35 without obsolete tools package
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdk_tool="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdk_tool" && test -x "$sdk_tool"
          "$sdk_tool" --sdk_root="$sdk_root" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Require production signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in HKEM_ANDROID_KEYSTORE_BASE64 HKEM_ANDROID_KEYSTORE_PASSWORD HKEM_ANDROID_KEY_ALIAS HKEM_ANDROID_KEY_PASSWORD; do
            test -n "${!name}" || { echo "::error::Missing required signing secret: $name"; exit 1; }
          done
      - name: Decode keystore into temporary runner storage
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$HKEM_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/account5-release.keystore"
          test -s "$RUNNER_TEMP/account5-release.keystore"
          echo "HKEM_ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/account5-release.keystore" >> "$GITHUB_ENV"
      - name: Build signed APK, Play Store AAB, and run Android lint
        run: gradle :app:assembleRelease :app:bundleRelease :app:lintRelease --no-daemon
      - name: Verify package signature and checksum
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose "$apk"
          sha256sum "$apk" > "$apk.sha256"
          cat "$apk.sha256"
          aab=app/build/outputs/bundle/release/app-release.aab
          test -s "$aab" || { echo '::error::Google Play App Bundle is missing'; exit 1; }
          jarsigner -verify -strict -certs "$aab"
          sha256sum "$aab" > "$aab.sha256"
          cat "$aab.sha256"
      - name: Install malware scanner and update signatures
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          clamscan --version
      - name: Scan signed release APK and fail closed on malware or scanner errors
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          clamscan --infected --no-summary "$apk"
          aab=app/build/outputs/bundle/release/app-release.aab
          clamscan --infected --no-summary "$aab"
          printf 'malwareScan=passed\nsignatureVerified=true\n' > "$apk.security.txt"
          sha256sum "$apk" >> "$apk.security.txt"
          printf 'scannedSha256=' >> "$apk.security.txt"
          sha256sum "$apk" | cut -d ' ' -f 1 >> "$apk.security.txt"
      - name: Install and launch the actual signed APK on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          working-directory: heavenly-key-accounts/account-05-heavenly-key-app/native/android
          script: |
            set -euo pipefail
            apk=app/build/outputs/apk/release/app-release.apk
            test -s "$apk"
            adb install -r "$apk"
            adb shell pm path org.heavenlykey.apps | grep -q '^package:'
            adb shell am start -W -n org.heavenlykey.apps/.MainActivity
            sleep 8
            adb shell pidof org.heavenlykey.apps | grep -Eq '[0-9]+'
            adb shell dumpsys activity activities | grep -q org.heavenlykey.apps
      - name: Reconfirm installer SHA-256 after device testing
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          expected="$(awk 'NR==1 {print $1}' "$apk.sha256")"
          actual="$(sha256sum "$apk" | cut -d ' ' -f 1)"
          test "$actual" = "$expected" || {
            echo "::error::Signed APK changed during emulator verification"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: heavenly-key-account5-signed-android-release
          path: |
            heavenly-key-accounts/account-05-heavenly-key-app/native/android/app/build/outputs/apk/release/app-release.apk
            heavenly-key-accounts/account-05-heavenly-key-app/native/android/app/build/outputs/apk/release/app-release.apk.sha256
            heavenly-key-accounts/account-05-heavenly-key-app/native/android/app/build/outputs/apk/release/app-release.apk.security.txt
            heavenly-key-accounts/account-05-heavenly-key-app/native/android/app/build/outputs/bundle/release/app-release.aab
            heavenly-key-accounts/account-05-heavenly-key-app/native/android/app/build/outputs/bundle/release/app-release.aab.sha256
          retention-days: 30
          if-no-files-found: error
      - name: Remove keystore from runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/account5-release.keystore"
