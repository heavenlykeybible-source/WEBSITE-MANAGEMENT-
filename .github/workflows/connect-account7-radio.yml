name: Connect Account 7 Radio to Account 2
on:
  workflow_dispatch:
  push:
    branches: [prepare/account-07-radio-20261023]
    paths: ['.github/workflows/connect-account7-radio.yml']
permissions:
  contents: read
concurrency:
  group: account7-radio-production
  cancel-in-progress: false
jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify tests before connection changes
        run: |
          node tests/run.mjs
          node tests/radio-source-adapter.mjs
      - name: Connect existing Radio and Media Engine
        env:
          ACCOUNT_2_TOKEN: ${{ secrets.ACCOUNT_2_TOKEN }}
          CLOUDFLARE_RADIO_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_RADIO_ACCOUNT_ID }}
          CLOUDFLARE_RADIO_API_TOKEN: ${{ secrets.CLOUDFLARE_RADIO_API_TOKEN }}
          RADIO_PUBLIC_API_KEY: ${{ secrets.RADIO_PUBLIC_API_KEY }}
          OWNER_APPROVED_RADIO_KEY_ROTATION: 'true'
        run: node scripts/radio/connect-source.mjs
