name: Check Account 2 Radio Connection Credential
on:
  workflow_dispatch:
  push:
    branches: [prepare/account-07-radio-20261023]
    paths: ['.github/workflows/diagnose-account7-access.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Account 7 Pages and Workers access without changing resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_RADIO_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_RADIO_ACCOUNT_ID }}
          ACCOUNT_2_TOKEN: ${{ secrets.ACCOUNT_2_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token||!account)throw Error('Account 7 GitHub secrets are missing');
          const sourceToken=process.env.ACCOUNT_2_TOKEN;
          if(!sourceToken){throw Error('Connection blocked: ACCOUNT_2_TOKEN is missing from Website Management GitHub Actions secrets. No connection or credential was changed.');}
          else for(const path of ['workers/subdomain','workers/scripts/heavenlykey-media/settings']){
            const r=await fetch('https://api.cloudflare.com/client/v4/accounts/c324d871146f8fcc5e7dcd3da057011c/'+path,{headers:{Authorization:'Bearer '+sourceToken},signal:AbortSignal.timeout(15000)});
            const d=await r.json(),v=d.result;
            console.log(JSON.stringify({path,http:r.status,success:d.success,errorCodes:d.errors?.map(e=>e.code),result:path.endsWith('/settings')?{bindings:v?.bindings?.map(b=>({name:b.name,type:b.type}))}:v}));
          }
          JS
