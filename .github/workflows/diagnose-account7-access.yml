name: Diagnose Account 7 Cloudflare Access
on:
  workflow_dispatch:
  push:
    branches: [prepare/account-07-radio-20261023]
    paths: ['.github/workflows/diagnose-account7-access.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Account 7 Pages and Workers access without changing resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_RADIO_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_RADIO_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token||!account)throw Error('Account 7 GitHub secrets are missing');
          for(const path of ['workers/scripts/heavenlykeyradio/settings','workers/scripts/heavenlykeyradio/subdomain','workers/subdomain','workers/domains']){
            const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(account)+'/'+path,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(15000)});
            const d=await r.json(),v=d.result;
            const result=path.endsWith('/settings')?{bindings:v?.bindings?.map(b=>({name:b.name,type:b.type,...(b.type==='plain_text'&&/ORIGIN|URL/.test(b.name)?{text:b.text}:{})})),compatibility_date:v?.compatibility_date,assets:v?.assets}:v;
            console.log(JSON.stringify({path,http:r.status,success:d.success,errorCodes:d.errors?.map(e=>e.code),result}));
          }
          JS
