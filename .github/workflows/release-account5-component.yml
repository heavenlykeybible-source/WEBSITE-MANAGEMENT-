name: "[RETIRED] Release Account 5 Component Independently"
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Choose an isolated page or installation guide; never changes main app Worker'
        required: true
        type: choice
        options:
          - premium-page
          - guide-android
          - guide-iphone
          - guide-ipad
          - guide-windows
          - guide-mac
permissions:
  contents: read
concurrency:
  group: account5-component-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  verify-and-publish:
    if: ${{ false }} # Use the existing canonical Worker release instead.
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    defaults:
      run:
        working-directory: heavenly-key-accounts/account-05-heavenly-key-app/source
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ACCOUNT5_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT5_CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify full app source first
        run: npm test
      - name: Stage only selected page and its reviewed static dependencies
        run: node scripts/stage-component-release.mjs
      - name: Require isolated Account 5 credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || exit 1
          test -n "$CLOUDFLARE_ACCOUNT_ID" || exit 1
      - name: Publish to dedicated Pages project only
        run: echo 'Use the existing Account 5 Worker release; duplicate component Pages publishing is retired.' && exit 1
      - name: Verify isolated page responds
        run: |
          echo "Deployment must be verified on the dedicated Pages URL; it does not update the main Account 5 Worker."
