name: Zoom Studio checks and deployment
on:
  push:
    paths: ['zoom-studio/**', 'scripts/existing-worker-release.mjs', 'tests/**', 'control-room-worker.js', '.github/workflows/zoom-studio.yml']
  pull_request:
    paths: ['zoom-studio/**', 'scripts/existing-worker-release.mjs', 'tests/**', 'control-room-worker.js', '.github/workflows/zoom-studio.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy Account 8 MeetingSpace to its confirmed dedicated Cloudflare Worker'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: zoom-studio-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify existing Control Room
        run: node tests/run.mjs
      - name: Verify Zoom Studio
        run: npm test --prefix zoom-studio
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    environment: account8-meetingspace-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Account 8 deployment authorization
        env:
          MEETINGSPACE_TOKEN: ${{ secrets.MEETINGSPACE_ACCOUNT8_API_TOKEN }}
        run: |
          if [ -z "$MEETINGSPACE_TOKEN" ]; then
            echo "::error::Account 8 deployment needs MEETINGSPACE_ACCOUNT8_API_TOKEN in the account8-meetingspace-production environment or repository Actions secrets."
            exit 1
          fi
      - name: Deploy the dedicated studio
        working-directory: zoom-studio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MEETINGSPACE_ACCOUNT8_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '6401a8f41a41f5325ba5bd4d006b4ff5'
          MEETINGSPACE_ACCOUNT8_CLOUDFLARE_ID: '6401a8f41a41f5325ba5bd4d006b4ff5'
          STUDIO_D1_DATABASE_ID: 'f47b2e3f-f937-4d6e-8891-f08d8bc4f6b8'
          MEETINGSPACE_ACCOUNT8_DATABASE_CONFIRMED: '1'
          MEETINGSPACE_PRIVATE_PREVIEW: '1'
          MEETINGSPACE_SHARED_CLOUDFLARE_ACCOUNT: '1'
          MEETINGSPACE_ACCOUNT8_RELEASE_ORIGIN: 'https://meeting.heavenlykey.org'
        run: npm run deploy
