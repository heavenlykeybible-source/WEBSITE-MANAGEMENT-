name: Check Account 5 Heavenly Key App

on:
  push:
    branches: [main]
    paths:
      - 'heavenly-key-accounts/account-05-heavenly-key-app/source/**'
      - '.github/workflows/check-account5-app.yml'
  pull_request:
    paths:
      - 'heavenly-key-accounts/account-05-heavenly-key-app/source/**'
      - '.github/workflows/check-account5-app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: account5-app-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: heavenly-key-accounts/account-05-heavenly-key-app/source
    steps:
      - name: Check out app source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate scripts, pages and assets
        run: npm run build
      - name: Run full Account 5 test suite
        run: npm test
      - name: Verify Cloudflare bundle without publishing
        run: npx --no-install wrangler deploy --dry-run --config wrangler.toml
