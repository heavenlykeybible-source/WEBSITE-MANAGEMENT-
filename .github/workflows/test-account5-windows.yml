name: Test Account 5 native Windows app
on:
  workflow_dispatch:
  push:
    paths:
      - 'heavenly-key-accounts/account-05-heavenly-key-app/native/windows/**'
      - '.github/workflows/test-account5-windows.yml'
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore pinned WebView2 dependencies
        working-directory: heavenly-key-accounts/account-05-heavenly-key-app/native/windows
        run: dotnet restore HeavenlyKeyWindows.csproj
      - name: Compile native Windows application
        working-directory: heavenly-key-accounts/account-05-heavenly-key-app/native/windows
        run: dotnet build HeavenlyKeyWindows.csproj --no-restore -c Release
      - name: Package Windows x64 self-contained testing executable
        working-directory: heavenly-key-accounts/account-05-heavenly-key-app/native/windows
        shell: pwsh
        run: |
          dotnet publish HeavenlyKeyWindows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./test-publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-Item ./test-publish/HeavenlyKeyWindows.exe -ErrorAction Stop
          if ($exe.Length -lt 100000) { throw "Windows executable is unexpectedly small" }
          Get-FileHash ./test-publish/HeavenlyKeyWindows.exe -Algorithm SHA256 | Format-List
      - name: Verify MSIX package structure without signing or distribution
        working-directory: heavenly-key-accounts/account-05-heavenly-key-app/native/windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -Path './test-publish' -Destination './signed-candidate' -Recurse -Force
          New-Item -ItemType Directory -Path './test-msix' -Force | Out-Null
          # Deliberately leave a previous installer and metadata in the publish
          # directory to ensure the new MSIX cannot recursively package them.
          Set-Content -LiteralPath './signed-candidate/old-release.msix' -Value 'prior package'
          Set-Content -LiteralPath './signed-candidate/old-release.security.txt' -Value 'prior report'
          ./package-msix.ps1 -Publisher 'CN=Heavenly Key Test' -OutputPath (Join-Path (Resolve-Path './test-msix').Path 'HeavenlyKeyWindows.msix')
          if ((Test-Path './msix-staging/old-release.msix') -or (Test-Path './msix-staging/old-release.security.txt')) {
            throw 'Windows MSIX staging leaked previous release artifacts'
          }
          if (-not (Test-Path './test-msix/HeavenlyKeyWindows.msix')) { throw 'MSIX packaging failed' }
          # Read the actual MSIX ZIP payload and identity, not just its staging folder.
          Add-Type -AssemblyName System.IO.Compression
          $msixPath = (Resolve-Path './test-msix/HeavenlyKeyWindows.msix').Path
          $zip = [System.IO.Compression.ZipFile]::OpenRead($msixPath)
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName })
            if ($entries -notcontains 'HeavenlyKeyWindows.exe') { throw 'MSIX is missing launch executable' }
            if ($entries -notcontains 'AppxManifest.xml') { throw 'MSIX manifest missing' }
            if ($entries | Where-Object { $_ -match '(?i)(old-release|\\.security\\.txt$|\\.pfx$|\\.sha256$)' }) {
              throw 'MSIX leaked stale installer files, reports, or signing materials'
            }
            $manifestEntry = $zip.GetEntry('AppxManifest.xml')
            $reader = [IO.StreamReader]::new($manifestEntry.Open())
            try { [xml]$manifestXml = $reader.ReadToEnd() } finally { $reader.Dispose() }
            $identity = $manifestXml.Package.Identity
            if ($identity.Name -ne 'HeavenlyKey.Apps' -or $identity.ProcessorArchitecture -ne 'x64') {
              throw 'MSIX identity or target architecture differs from reviewed Windows app'
            }
            $application = $manifestXml.Package.Applications.Application
            if ($application.Executable -ne 'HeavenlyKeyWindows.exe') {
              throw 'Windows package entry point is not the built application'
            }
            foreach ($asset in @('Assets/Square150x150Logo.png','Assets/Square44x44Logo.png','Assets/StoreLogo.png')) {
              if ($entries -notcontains $asset) { throw "MSIX missing required image: $asset" }
            }
            Write-Host "Verified MSIX identity, x64 executable, image assets and clean payload"
          } finally { $zip.Dispose() }
          Get-FileHash './test-msix/HeavenlyKeyWindows.msix' -Algorithm SHA256 | Format-List
      - name: Retain nonproduction Windows testing build
        uses: actions/upload-artifact@v4
        with:
          name: heavenly-key-account5-windows-test-build-unsigned
          path: heavenly-key-accounts/account-05-heavenly-key-app/native/windows/test-publish/
          retention-days: 14
          if-no-files-found: error
