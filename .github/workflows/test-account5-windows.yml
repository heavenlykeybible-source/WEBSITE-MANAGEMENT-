name: Test Account 5 native Windows app
on:
  workflow_dispatch:
  push:
    paths:
      - 'heavenly-key-accounts/account-05-heavenly-key-app/native/windows/**'
      - '.github/workflows/test-account5-windows.yml'
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore pinned WebView2 dependencies
        working-directory: heavenly-key-accounts/account-05-heavenly-key-app/native/windows
        run: dotnet restore HeavenlyKeyWindows.csproj
      - name: Compile native Windows application
        working-directory: heavenly-key-accounts/account-05-heavenly-key-app/native/windows
        run: dotnet build HeavenlyKeyWindows.csproj --no-restore -c Release
      - name: Package Windows x64 self-contained testing executable
        working-directory: heavenly-key-accounts/account-05-heavenly-key-app/native/windows
        shell: pwsh
        run: |
          dotnet publish HeavenlyKeyWindows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./test-publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-Item ./test-publish/HeavenlyKeyWindows.exe -ErrorAction Stop
          if ($exe.Length -lt 100000) { throw "Windows executable is unexpectedly small" }
          Get-FileHash ./test-publish/HeavenlyKeyWindows.exe -Algorithm SHA256 | Format-List
      - name: Verify MSIX package structure without signing or distribution
        working-directory: heavenly-key-accounts/account-05-heavenly-key-app/native/windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -Path './test-publish' -Destination './signed-candidate' -Recurse -Force
          New-Item -ItemType Directory -Path './test-msix' -Force | Out-Null
          ./package-msix.ps1 -Publisher 'CN=Heavenly Key Test' -OutputPath (Join-Path (Resolve-Path './test-msix').Path 'HeavenlyKeyWindows.msix')
          if (-not (Test-Path './test-msix/HeavenlyKeyWindows.msix')) { throw 'MSIX packaging failed' }
          Get-FileHash './test-msix/HeavenlyKeyWindows.msix' -Algorithm SHA256 | Format-List
      - name: Retain nonproduction Windows testing build
        uses: actions/upload-artifact@v4
        with:
          name: heavenly-key-account5-windows-test-build-unsigned
          path: heavenly-key-accounts/account-05-heavenly-key-app/native/windows/test-publish/
          retention-days: 14
          if-no-files-found: error
