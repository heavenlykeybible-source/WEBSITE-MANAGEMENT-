name: Account 10 build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: account10-social-management
      - run: npm run check
        working-directory: account10-social-management
      - run: npm run build:check
        working-directory: account10-social-management
      - name: Validate D1 schema and migrations in SQLite
        working-directory: account10-social-management
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          db.execute('PRAGMA foreign_keys = ON')
          for file in ('schema.sql', 'migrations/0002_webhook_events.sql', 'migrations/0003_conversation_lookup.sql', 'migrations/0004_whatsapp_delivery.sql', 'migrations/0005_whatsapp_receipts.sql', 'migrations/0006_whatsapp_receipt_inbox.sql'):
              db.executescript(Path(file).read_text())
          db.execute("INSERT INTO conversations(id,channel,sender_id) VALUES('test','whatsapp_business','123')")
          db.execute("INSERT INTO messages(id,conversation_id,direction,body) VALUES('msg','test','inbound','hello')")
          db.execute("INSERT INTO webhook_events(id,provider,event_type,payload) VALUES('event','meta','whatsapp_business_account','{}')")
          assert db.execute("SELECT COUNT(*) FROM messages").fetchone()[0] == 1
          assert db.execute("PRAGMA foreign_key_check").fetchall() == []
          try:
              db.execute("INSERT INTO messages(id,conversation_id,direction,body) VALUES('orphan','missing','inbound','invalid')")
          except sqlite3.IntegrityError:
              pass
          else:
              raise AssertionError('Foreign-key enforcement is not active')
          for label, statement in (
              ('invalid direction', "INSERT INTO messages(id,conversation_id,direction,body) VALUES('bad','test','unknown','invalid')"),
              ('invalid destination', "INSERT INTO social_posts(id,body,platform) VALUES('bad','hello','unsupported')"),
          ):
              try:
                  db.execute(statement)
              except sqlite3.IntegrityError:
                  pass
              else:
                  raise AssertionError(f'{label} was accepted')
          db.execute("INSERT INTO social_accounts(id,channel,provider_account_ref) VALUES('a','whatsapp_business','provider_1')")
          try:
              db.execute("INSERT INTO social_accounts(id,channel,provider_account_ref) VALUES('b','whatsapp_business','provider_1')")
          except sqlite3.IntegrityError:
              pass
          else:
              raise AssertionError('Duplicate provider account was accepted')
          db.execute("UPDATE conversations SET human_paused=1, requested_human=1 WHERE id='test'")
          blocked = db.execute(
              "INSERT INTO messages(id,conversation_id,direction,body) "
              "SELECT 'automated','test','draft','auto reply' "
              "WHERE EXISTS(SELECT 1 FROM conversations WHERE id='test' AND human_paused=0 AND requested_human=0)"
          )
          assert blocked.rowcount == 0, 'Automation bypassed human takeover'
          db.execute("UPDATE conversations SET human_paused=0, requested_human=0 WHERE id='test'")
          resumed = db.execute(
              "INSERT INTO messages(id,conversation_id,direction,body) "
              "SELECT 'automated','test','draft','auto reply' "
              "WHERE EXISTS(SELECT 1 FROM conversations WHERE id='test' AND human_paused=0 AND requested_human=0)"
          )
          assert resumed.rowcount == 1, 'Automation did not resume'
          db.execute("INSERT INTO messages(id,conversation_id,direction,body) VALUES('approved','test','outbound','hello')")
          db.execute("INSERT INTO whatsapp_delivery_attempts(draft_id,phone_number_id) VALUES('approved','123456')")
          try:
              db.execute("INSERT INTO whatsapp_delivery_attempts(draft_id,phone_number_id) VALUES('approved','123456')")
          except sqlite3.IntegrityError:
              pass
          else:
              raise AssertionError('Duplicate delivery attempt accepted')
          try:
              db.execute("INSERT INTO whatsapp_delivery_attempts(draft_id,phone_number_id,state) VALUES('bad','123456','sent')")
          except sqlite3.IntegrityError:
              pass
          else:
              raise AssertionError('Orphan delivery attempt accepted')
          db.execute("UPDATE whatsapp_delivery_attempts SET provider_message_id='wamid.1',state='sent' WHERE draft_id='approved'")
          db.execute("UPDATE whatsapp_delivery_attempts SET delivery_status='delivered',receipt_at=CURRENT_TIMESTAMP WHERE provider_message_id='wamid.1'")
          assert db.execute("SELECT delivery_status FROM whatsapp_delivery_attempts WHERE draft_id='approved'").fetchone()[0] == 'delivered'
          db.execute("INSERT INTO messages(id,conversation_id,direction,body,created_at) VALUES('wa_msg_old','test','inbound','old',datetime('now','-25 hours'))")
          db.execute("INSERT INTO messages(id,conversation_id,direction,body,created_at) VALUES('wa_msg_recent','test','inbound','recent',datetime('now','-1 hour'))")
          allowed = db.execute("SELECT id FROM messages WHERE conversation_id='test' AND direction='inbound' AND id GLOB 'wa_msg_*' AND datetime(created_at)>=datetime('now','-24 hours')").fetchall()
          assert allowed == [('wa_msg_recent',)], 'WhatsApp service window accepted stale or unverified inbound data'
          db.execute("INSERT INTO whatsapp_receipt_inbox(provider_message_id,phone_number_id,delivery_status) VALUES('wamid.early','123456','delivered')")
          db.execute("INSERT INTO messages(id,conversation_id,direction,body) VALUES('approved_early','test','outbound','reply')")
          db.execute("INSERT INTO whatsapp_delivery_attempts(draft_id,phone_number_id,state,provider_message_id) VALUES('approved_early','123456','sent','wamid.early')")
          db.execute("UPDATE whatsapp_delivery_attempts SET delivery_status=(SELECT delivery_status FROM whatsapp_receipt_inbox WHERE provider_message_id='wamid.early' AND phone_number_id='123456') WHERE draft_id='approved_early'")
          assert db.execute("SELECT delivery_status FROM whatsapp_delivery_attempts WHERE draft_id='approved_early'").fetchone()[0] == 'delivered'
          print('Schema, migrations and basic D1 records validated')
          PY
