name: Deploy Website Management to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      approved_commit:
        description: 'Exact approved main-branch commit SHA to deploy'
        required: true
        type: string
      bootstrap_legacy_worker:
        description: 'One-time owner approval only: permit first release when the existing Worker has no verifiable Git commit marker'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: website-management-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: account-4
    steps:
      - name: Check out the source and complete release ancestry
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Block stale branches and unapproved commits
        env:
          APPROVED_COMMIT: ${{ github.event_name == 'push' && github.sha || inputs.approved_commit }}
        run: |
          test "${{ github.ref }}" = 'refs/heads/main' || { echo '::error::Production releases must run from main'; exit 1; }
          test "$APPROVED_COMMIT" = "$(git rev-parse HEAD)" || { echo '::error::Approval SHA does not match checkout; stale release blocked'; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Check Cloudflare deployment credentials
        env:
          CF_API_TOKEN: ${{ secrets.ACCOUNT4_CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::Add ACCOUNT4_CLOUDFLARE_API_TOKEN to Account 4 GitHub secrets."
            exit 1
          fi

      - name: Confirm correct Account 4 destination
        env:
          CF_ACCOUNT: ${{ secrets.ACCOUNT4_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_ACCOUNT" || { echo '::error::Missing ACCOUNT4_CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test "$CF_ACCOUNT" = '404ebf05a781fcccbbed44aeb02cb72b' || { echo '::error::Exact Account 4 destination required; deployment blocked'; exit 1; }

      - name: Verify existing Account 4 Worker and live bindings
        run: node scripts/deploy-account4-existing.mjs --check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ACCOUNT4_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT4_CLOUDFLARE_ACCOUNT_ID }}

      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run project tests
        run: |
          node tests/account4-release-lineage.mjs
          npm test
          node tests/account4-studio-menu.mjs
          node tests/account4-unified-access.mjs
          node tests/owner-passkeys.mjs
          node tests/ai-workspace.mjs
          node tests/native-imports.mjs
          node tests/domains.mjs

      - name: Verify Account 4 owner approval interface
        run: node tests/account4-permission-ui.mjs

      - name: Install browser test dependencies
        timeout-minutes: 4
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1 @cloudflare/puppeteer@1.4.0
          npx playwright install chromium

      - name: Verify CMS editing and preview controls
        run: |
          npm run test:cms-dom
          npm run test:cms-browser
          node tests/account4-permissions-browser.mjs
          node tests/native-imports-browser.mjs
          node tests/browser-agent-chromium.mjs

      - name: Integrate saved interfaces into active Worker
        run: |
          npm run build:cms
          node tests/account4-subdomain-integration.mjs
          node tests/account4-large-upload-integration.mjs
          node tests/account4-provider-verification.mjs
          npm run test:ai-worker-permissions
          node --check control-room-worker.js
          grep -q 'Cloudflare API tokens' control-room-worker.js
          grep -q 'Authorized Cloudflare deployment proposals' control-room-worker.js
          node --input-type=module -e "import fs from 'node:fs'; const s=fs.readFileSync('control-room-worker.js','utf8'); for(const n of ['VISUAL CMS CLIENT','AI CAPABILITIES','AI PERMISSION CLIENT','AI WORKSPACE','OWNER PASSKEY SERVER','NATIVE WORKSPACE SERVER']) if(s.split('// BEGIN '+n).length!==2||s.split('// END '+n).length!==2) throw Error('Missing or duplicate generated section: '+n);"

      - name: Verify Browser Agent integration in assembled Worker
        run: node tests/browser-agent.mjs

      - name: Verify approved source was not replaced during build
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'push' && github.sha || inputs.approved_commit }}" || { echo '::error::Checked-out release changed'; exit 1; }
          test -f control-room-worker.js || { echo '::error::Missing Control Room Worker'; exit 1; }
          node --check control-room-worker.js
          test -z "$(git status --porcelain -- package.json package-lock.json wrangler.toml)" || { echo '::error::Release build altered locked dependencies or production configuration'; exit 1; }

      - name: Block superseded releases
        env:
          APPROVED_COMMIT: ${{ github.event_name == 'push' && github.sha || inputs.approved_commit }}
        run: |
          git fetch --no-tags origin main
          test "$APPROVED_COMMIT" = "$(git rev-parse origin/main)" || { echo '::error::A newer main commit exists; stale production deployment refused'; exit 1; }

      - name: Deploy existing Worker without changing its resources
        run: node scripts/deploy-account4-existing.mjs
        env:
          ACCOUNT4_PRODUCTION_APPROVED: '1'
          ACCOUNT4_APPROVED_COMMIT: ${{ github.event_name == 'push' && github.sha || inputs.approved_commit }}
          ACCOUNT4_ALLOW_UNMARKED_BASELINE: ${{ inputs.bootstrap_legacy_worker && '1' || '0' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.ACCOUNT4_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT4_CLOUDFLARE_ACCOUNT_ID }}

