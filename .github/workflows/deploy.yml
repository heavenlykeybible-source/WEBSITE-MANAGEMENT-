name: Deploy Website Management to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'control-room-worker.js'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-management-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run project tests
        run: npm test

      - name: Check Cloudflare deployment credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN to the production environment or repository Actions secrets."
            exit 1
          fi

      - name: Deploy existing Worker without changing its resources
        run: npx --yes wrangler@4 deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cd095c096c2d5a42501e7d77cecbb34c

      - name: Verify Cloudflare Worker is responding
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-delay 3 \
            'https://website-management.heavenlykeyglobal-cd095c09.workers.dev/' \
            -o /dev/null
