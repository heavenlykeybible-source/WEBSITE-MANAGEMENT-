name: MeetingSpace checks
on:
  push:
    branches: [feature/account7-meetingspace]
    paths:
      - 'account7-meetingspace/**'
      - '.github/workflows/account7-meetingspace.yml'
  pull_request:
    paths:
      - 'account7-meetingspace/**'
      - '.github/workflows/account7-meetingspace.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: account7-meetingspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
