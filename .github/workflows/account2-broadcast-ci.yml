name: Account 2 Studio Broadcast Checks
on:
  push:
    branches:
      - 'fix/account2-*'
    paths:
      - 'heavenly-key-accounts/account-02-studio-radio-tv-media/**'
      - '.github/workflows/account2-broadcast-ci.yml'
  pull_request:
    paths:
      - 'heavenly-key-accounts/account-02-studio-radio-tv-media/**'
      - '.github/workflows/account2-broadcast-ci.yml'
permissions:
  contents: read
jobs:
  studio-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: heavenly-key-accounts/account-02-studio-radio-tv-media/source
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Broadcast safety checks
        run: npm run test:broadcast
      - name: Streaming destination security tests
        run: npm run test:stream-validation
      - name: D1 concurrency and state integrity tests
        run: npm run test:d1
      - name: TypeScript validation
        run: npm run check
      - name: Deployment preflight
        run: npm run preflight
