name: Inspect Studio domain routing
on:
  workflow_dispatch:
  push:
    branches: [prepare/account-07-radio-20261023]
    paths: ['.github/workflows/inspect-studio-domain.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read Account 2 domain mapping and zone access
        env:
          ACCOUNT_2_TOKEN: ${{ secrets.ACCOUNT_2_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const headers={Authorization:'Bearer '+process.env.ACCOUNT_2_TOKEN};
          for(const path of ['/zones/e47b50f70a14e09185dd461f24d3854e/workers/routes','/zones/e47b50f70a14e09185dd461f24d3854e/dns_records?name=studio.heavenlykey.org','/zones/e47b50f70a14e09185dd461f24d3854e/rulesets/phases/http_request_cache_settings/entrypoint']){
            const r=await fetch('https://api.cloudflare.com/client/v4'+path,{headers});const d=await r.json();
            const records=Array.isArray(d.result)?d.result.map(x=>({id:x.id,pattern:x.pattern,script:x.script,name:x.name,type:x.type,content:x.content,proxied:x.proxied})):d.result?.rules?.map(x=>({id:x.id,action:x.action,expression:x.expression,action_parameters:x.action_parameters}));
            console.log(JSON.stringify({path,http:r.status,success:d.success,codes:d.errors?.map(e=>e.code),records}));
          }
          JS
