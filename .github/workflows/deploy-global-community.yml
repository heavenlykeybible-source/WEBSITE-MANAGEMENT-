name: Deploy Account 3 Global Community

on:
  push:
    branches: [main]
    paths:
      - 'heavenly-key-accounts/account-03-global-christian-community/source/**'
      - '.github/workflows/deploy-global-community.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-community-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    defaults:
      run:
        working-directory: heavenly-key-accounts/account-03-global-christian-community/source
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm complete application source
        run: |
          test -f package.json
          test -f wrangler.toml
          test -f src/index.ts
          test -f public/index.html
          test -f public/app.js

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund --package-lock=false
          fi

      - name: Type check and verify complete application
        run: npm run build

      - name: Confirm Cloudflare API credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID secret'; exit 1; }

      - name: Add passkey tables to the existing community database
        run: npx wrangler d1 execute heavenly-key-global-community-db --remote --config wrangler.toml --file migrations/0020_passkeys.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker to Cloudflare
        run: npx wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
