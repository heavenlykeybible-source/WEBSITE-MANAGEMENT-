name: Deploy Account 3 Global Community

on:
  push:
    branches: [main]
    paths:
      - 'config/approved-homepage-footer.json'
      - 'scripts/cleanup/sync-footer.mjs'
      - 'heavenly-key-accounts/account-03-global-christian-community/source/**'
      - '.github/workflows/deploy-global-community.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-community-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    defaults:
      run:
        working-directory: heavenly-key-accounts/account-03-global-christian-community/source
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the single approved homepage footer
        working-directory: ${{ github.workspace }}
        run: node scripts/cleanup/sync-footer.mjs
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm complete application source
        run: |
          test -f package.json
          test -f wrangler.toml
          test -f src/index.ts
          test -f public/index.html
          test -f public/app.js

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund --package-lock=false
          fi

      - name: Type check and verify complete application
        run: npm run build

      - name: Verify release gate
        env:
          ACCOUNT3_SECRETS_VERIFIED: ${{ vars.ACCOUNT3_SECRETS_VERIFIED }}
          ACCOUNT3_RESET_MAIL_VERIFIED: ${{ vars.ACCOUNT3_RESET_MAIL_VERIFIED }}
          ACCOUNT3_MIGRATIONS_VERIFIED: ${{ vars.ACCOUNT3_MIGRATIONS_VERIFIED }}
          ACCOUNT3_LIVE_TESTS_VERIFIED: ${{ vars.ACCOUNT3_LIVE_TESTS_VERIFIED }}
        run: node scripts/preflight.mjs --release

      - name: Confirm Cloudflare API credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID secret'; exit 1; }

      - name: Preserve previous healthy existing Worker
        id: release_snapshot
        working-directory: .
        run: node scripts/test-existing-worker-release.mjs && node scripts/existing-worker-release.mjs snapshot
        env:
          RELEASE_WORKER: heavenly-key-global-community
          RELEASE_ORIGIN: https://global.heavenlykey.org/
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker to Cloudflare
        run: npx wrangler deploy --config wrangler.toml --name heavenly-key-global-community --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify release and restore previous version on failure
        if: always() && !cancelled() && steps.release_snapshot.outcome == 'success'
        working-directory: .
        run: node scripts/existing-worker-release.mjs verify
        env:
          RELEASE_WORKER: heavenly-key-global-community
          RELEASE_ORIGIN: https://global.heavenlykey.org/
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heavenly-key-global-community-previous-deployments
          path: .release-state/
          retention-days: 90
