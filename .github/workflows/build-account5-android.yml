name: Build Account 5 Native Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'heavenly-key-accounts/account-05-heavenly-key-app/native/android/**'
      - '.github/workflows/build-account5-android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: heavenly-key-accounts/account-05-heavenly-key-app/native/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 35 without obsolete tools package
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdk_tool="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdk_tool" && test -x "$sdk_tool"
          "$sdk_tool" --sdk_root="$sdk_root" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android debug APK for installation testing
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon
      - name: Verify APK and publish SHA-256 checksum
        run: |
          set -eu
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          test -s "$apk"
          sha256sum "$apk" > "$apk.sha256"
          cat "$apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: heavenly-key-android-testing-apk
          path: |
            heavenly-key-accounts/account-05-heavenly-key-app/native/android/app/build/outputs/apk/debug/*.apk
            heavenly-key-accounts/account-05-heavenly-key-app/native/android/app/build/outputs/apk/debug/*.sha256
          retention-days: 30
