name: Heavenly Key Bible manual launch audit
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heavenly-key-bible-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Verify Bible source and editorial release gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify five-year devotional draft structure
        run: node apps/heavenly-key-bible/bible/tests/validate-strength-year1.mjs
      - name: Audit all five years for duplication, doctrine coverage and publication state
        run: node apps/heavenly-key-bible/bible/tests/audit-strength-five-years.mjs
      - name: Verify devotional UI and offline cache safeguards
        run: node apps/heavenly-key-bible/bible/tests/validate-strength-ui-security.mjs
      - name: Verify explicitly approved devotional batch allowlist
        run: node apps/heavenly-key-bible/bible/tests/validate-strength-publication-status.mjs
      - name: Gate publication of unapproved or repeated devotionals
        run: node apps/heavenly-key-bible/bible/tests/strength-publication-gate.mjs
