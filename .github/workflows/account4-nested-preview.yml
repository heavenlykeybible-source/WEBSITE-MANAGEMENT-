name: Verify and preview Account 4 project-import Control Room

on:
  push:
    branches: [feature/account4-large-project-staging-20261101]
    paths:
      - 'heavenly-key-accounts/account-04-website-management-control-room/source/**'
      - '.github/workflows/account4-nested-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: account4-import-preview
  cancel-in-progress: true

jobs:
  verify-and-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: account-4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ACCOUNT4_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT4_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify source selection is not the root production Worker
        run: |
          test -f src/index.ts
          test -f public/index.html
          test -f public/project-import.js
          test -f public/login.html
          grep -q 'project-imports/github' src/index.ts
          grep -q 'account3-github-import' public/index.html
          grep -q 'account3-github-import' public/project-import.js
          test "$(sed -n 's/^main = "\(.*\)"/\1/p' wrangler.toml)" = 'src/index.ts'
          node --check public/project-import.js
        working-directory: heavenly-key-accounts/account-04-website-management-control-room/source
      - name: Create isolated staging Worker configuration
        run: |
          sed 's/^name = "heavenlykey-control-room"$/name = "heavenlykey-control-room-import-preview"/' wrangler.toml > wrangler.import-preview.toml
          grep -q '^name = "heavenlykey-control-room-import-preview"$' wrangler.import-preview.toml
        working-directory: heavenly-key-accounts/account-04-website-management-control-room/source
      - name: Compile exact nested Worker source
        run: npx --yes wrangler@4.45.0 deploy --config wrangler.import-preview.toml --dry-run --outdir ./dist-preview
        working-directory: heavenly-key-accounts/account-04-website-management-control-room/source
      - name: Verify Account 4 Cloudflare deployment credentials are available
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing ACCOUNT4_CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing ACCOUNT4_CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Deploy isolated preview (never the root production Worker)
        run: npx --yes wrangler@4.45.0 deploy --config wrangler.import-preview.toml
        working-directory: heavenly-key-accounts/account-04-website-management-control-room/source
      - name: Smoke-test deployed Control Room UI and security boundary
        run: |
          set -euo pipefail
          url="https://heavenlykey-control-room-import-preview.emmanuel2026miracle.workers.dev"
          echo 'Checking homepage and expected controls'
          curl --fail --silent --show-error --retry 4 --retry-delay 2 "$url/" -o /tmp/account4-control-room.html
          for marker in account3-github-import project-review-refresh; do
            if ! grep -q "$marker" /tmp/account4-control-room.html; then
              echo "::error::Homepage missing $marker"
              exit 1
            fi
          done
          if grep -q 'Set ADMIN_USER and ADMIN_PASS' /tmp/account4-control-room.html; then
            echo '::error::Legacy root Worker served instead of project Control Room'
            exit 1
          fi
          echo 'Checking import client script'
          curl --fail --silent --show-error "$url/project-import.js" -o /tmp/account4-project-import.js
          grep -q 'project-imports/github' /tmp/account4-project-import.js || { echo '::error::Import script missing GitHub route'; exit 1; }
          echo 'Checking dedicated owner sign-in page'
          curl --fail --silent --show-error "$url/login.html" -o /tmp/account4-owner-login.html
          grep -q 'Control Room owner sign-in' /tmp/account4-owner-login.html || { echo '::error::Owner sign-in page has unexpected content'; head -c 450 /tmp/account4-owner-login.html; echo; exit 1; }
          echo 'Checking protected import API'
          status="$(curl --silent --output /tmp/account4-unauthorized.json --write-out '%{http_code}' "$url/api/project-imports")"
          echo "Unauthenticated API HTTP status: $status"
          test "$status" = '401' || { echo "::error::Expected 401, got $status"; exit 1; }
          grep -q 'Administrator sign-in required' /tmp/account4-unauthorized.json || { echo '::error::Unexpected API error response'; exit 1; }
