name: Account 9 VideoEditor - Cloudflare Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-account-09-videoeditor.yml'
      - 'heavenly-key-accounts/account-09-heavenly-key-videoeditor/source/**'
concurrency:
  group: account9-cloudflare-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy-account9:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: account9-staging
    defaults:
      run:
        working-directory: heavenly-key-accounts/account-09-heavenly-key-videoeditor/source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify full application source
        run: |
          test -s public/index.html
          test -s 'functions/api/[[path]].js'
          test -s public/_headers
          test -s wrangler.toml
          test -s public/assets/logo-256.png
          test -s scripts/preflight.mjs
          test -s tests/be.mjs
          test -s schema.sql
      - name: Syntax validation
        run: node --check 'functions/api/[[path]].js'
      - name: Full preflight and backend regression tests
        run: npm run check
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ACCOUNT9_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT9_CF_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Missing ACCOUNT9_CF_API_TOKEN in account9-staging secrets"; exit 1; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::Missing ACCOUNT9_CF_ACCOUNT_ID in account9-staging secrets"; exit 1; fi
      - name: Deploy Account 9 once to Cloudflare Pages production
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.ACCOUNT9_CF_API_TOKEN }}
          accountId: ${{ secrets.ACCOUNT9_CF_ACCOUNT_ID }}
          workingDirectory: heavenly-key-accounts/account-09-heavenly-key-videoeditor/source
          command: pages deploy public --project-name=heavenlykey-studio --branch=main
