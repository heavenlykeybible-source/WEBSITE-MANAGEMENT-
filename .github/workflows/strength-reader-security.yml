name: Strength for Today reader security regression

on:
  pull_request:
    paths:
      - "apps/heavenly-key-bible/heavenly-key-website/bible/strength-for-today.html"
      - "apps/heavenly-key-bible/heavenly-key-website/bible/strength-for-today.css"
      - "apps/heavenly-key-bible/heavenly-key-website/bible/strength-for-today.js"
      - "apps/heavenly-key-bible/heavenly-key-website/bible/strength-share-studio.js"
      - "apps/heavenly-key-bible/heavenly-key-website/bible/strength-devotionals-*.json"
      - "apps/heavenly-key-bible/bible/tests/strength-reader-csp-regression.mjs"
      - ".github/workflows/strength-reader-security.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strength-reader-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Check reader and share-studio JavaScript syntax
        run: |
          node --check apps/heavenly-key-bible/heavenly-key-website/bible/strength-for-today.js
          node --check apps/heavenly-key-bible/heavenly-key-website/bible/strength-share-studio.js
      - name: Run reader CSP and dated-content regression checks
        run: node --test apps/heavenly-key-bible/bible/tests/strength-reader-csp-regression.mjs
