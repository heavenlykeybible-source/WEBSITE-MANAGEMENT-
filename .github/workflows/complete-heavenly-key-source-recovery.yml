name: Complete Heavenly Key source recovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-heavenly-key-source-recovery.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: heavenly-key-recovery-import
  cancel-in-progress: false
jobs:
  copy-missing-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout recovery branch with write permissions
        uses: actions/checkout@v4
        with:
          ref: global-community-recovery-20261022
          persist-credentials: true
          fetch-depth: 1
      - name: Download original public source
        run: git clone --depth 1 https://github.com/heavenlykeybible-source/onlinebible.git /tmp/heavenly-key-onlinebible
      - name: Restore only missing files, never overwrite newer files
        shell: bash
        run: |
          set -euo pipefail
          ROOT=heavenly-key-accounts
          mkdir -p "$ROOT/account-01-main-website/source"
          mkdir -p "$ROOT/account-02-studio-radio-tv-media/source"
          mkdir -p "$ROOT/account-03-global-christian-community/source"
          mkdir -p "$ROOT/account-03-global-christian-community/alternate-global-community"
          mkdir -p "$ROOT/account-04-website-management-control-room/uploaded-reference"
          mkdir -p "$ROOT/account-05-heavenly-key-app/source"
          mkdir -p "$ROOT/account-06-online-bible/source"
          mkdir -p "$ROOT/shared/portal-router"
          rsync -a --ignore-existing --exclude=.git /tmp/heavenly-key-onlinebible/heavenly-key-website/ "$ROOT/account-01-main-website/source/"
          rsync -a --ignore-existing --exclude=.git /tmp/heavenly-key-onlinebible/media-engine/ "$ROOT/account-02-studio-radio-tv-media/source/"
          rsync -a --ignore-existing --exclude=.git '/tmp/heavenly-key-onlinebible/Global Christian Community/implementation/' "$ROOT/account-03-global-christian-community/source/"
          rsync -a --ignore-existing --exclude=.git /tmp/heavenly-key-onlinebible/global-community/ "$ROOT/account-03-global-christian-community/alternate-global-community/"
          rsync -a --ignore-existing --exclude=.git /tmp/heavenly-key-onlinebible/account4-control-room/ "$ROOT/account-04-website-management-control-room/uploaded-reference/"
          rsync -a --ignore-existing --exclude=.git /tmp/heavenly-key-onlinebible/heavenly-key-app/ "$ROOT/account-05-heavenly-key-app/source/"
          rsync -a --ignore-existing --exclude=.git /tmp/heavenly-key-onlinebible/bible/ "$ROOT/account-06-online-bible/source/"
          rsync -a --ignore-existing --exclude=.git /tmp/heavenly-key-onlinebible/portal-router/ "$ROOT/shared/portal-router/"
      - name: Verify all original files are present at mapped destinations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/heavenly-key-onlinebible')
          pairs=[('heavenly-key-website','account-01-main-website/source'),('media-engine','account-02-studio-radio-tv-media/source'),('Global Christian Community/implementation','account-03-global-christian-community/source'),('global-community','account-03-global-christian-community/alternate-global-community'),('account4-control-room','account-04-website-management-control-room/uploaded-reference'),('heavenly-key-app','account-05-heavenly-key-app/source'),('bible','account-06-online-bible/source'),('portal-router','shared/portal-router')]
          missing=[]
          expected=0
          for source,target in pairs:
              src=root/source
              dst=Path('heavenly-key-accounts')/target
              for p in src.rglob('*'):
                  if not p.is_file() or '.git' in p.parts: continue
                  expected+=1
                  if not (dst/p.relative_to(src)).is_file(): missing.append(str(dst/p.relative_to(src)))
          print(f'Expected files: {expected}; missing files: {len(missing)}')
          if missing:
              print('\n'.join(missing[:30]))
              raise SystemExit(1)
          PY
      - name: Commit source-only additions to recovery branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A heavenly-key-accounts
          if git diff --cached --quiet; then
            echo 'No missing files remain to commit.'
          else
            git commit -m 'Complete account source archive recovery without overwriting newer files'
            git push origin HEAD:global-community-recovery-20261022
          fi
