name: Account 5 release safety
on:
  push:
    branches: [account5-download-readiness-20261030]
    paths:
      - 'scripts/validate-account5-releases.mjs'
      - 'account5-release-manifest.json'
      - 'heavenly-key-accounts/account-05-heavenly-key-app/source/**'
      - '.github/workflows/account5-release-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check validator syntax
        run: node --check scripts/validate-account5-releases.mjs
      - name: Test Account 5 source
        run: npm test --prefix heavenly-key-accounts/account-05-heavenly-key-app/source
      - name: Ensure missing manifest blocks release
        shell: bash
        run: |
          if node scripts/validate-account5-releases.mjs /tmp/account5-missing-manifest.json; then
            echo "ERROR: missing manifest was accepted"
            exit 1
          fi
  release-gate:
    needs: validator-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require real inventory and verified packages
        run: node scripts/validate-account5-releases.mjs account5-release-manifest.json
