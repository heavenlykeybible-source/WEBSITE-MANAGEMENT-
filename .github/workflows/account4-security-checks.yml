name: Account 4 non-deploying security checks
on:
  pull_request:
    paths:
      - 'control-room-worker.js'
      - 'config/heavenly-key-accounts.json'
      - 'tests/**'
      - 'scripts/account4-quick-navigation.mjs'
      - 'scripts/apply-reviewed-account4-upgrade.mjs'
      - 'patches/account4-reviewed-upgrade.json'
      - 'patches/account4-reviewed-upgrade.patch'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.toml'
      - 'config/**'
      - '.github/workflows/**'
      - '.github/workflows/account4-security-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax
        run: node --check control-room-worker.js
      - name: Verify security guard presence
        run: node tests/account4-launch-guards.mjs
      - name: Check for unresolved conflict markers
        run: |
          if grep -nE '^(<<<<<<< |=======|>>>>>>> )' control-room-worker.js; then
            echo 'Unresolved merge conflict marker found' >&2
            exit 1
          fi
      - name: Run existing repository tests
        run: |
          npm ci
          npm test
      - name: Verify navigation dry-run before applying changes
        run: npm run check:account4-navigation
      - name: Verify navigation upgrade after repository patch tests
        run: |
          npm run prepare:account4-release
          node tests/account4-navigation-regression.mjs
# This workflow intentionally does not publish, deploy or access production secrets.
