name: Account 4 Security Checks
on:
  push:
    branches: [main]
    paths:
      - 'control-room-worker.js'
      - 'workspace/**'
      - 'security/**'
      - 'cms/**'
      - 'ai/**'
      - 'scripts/**'
      - 'tests/**'
      - 'schema.sql'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.toml'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  pull_request:
    paths:
      - 'control-room-worker.js'
      - 'workspace/**'
      - 'security/**'
      - 'cms/**'
      - 'ai/**'
      - 'scripts/**'
      - 'tests/**'
      - 'schema.sql'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.toml'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies for all reported vulnerabilities
        run: npm audit --audit-level=low
      - name: Validate production configuration safety
        run: |
          python3 - <<'PY'
          import tomllib
          with open('wrangler.toml', 'rb') as file:
              cfg = tomllib.load(file)
          assert cfg['name'] == 'website-management'
          assert set(cfg['secrets']['required']) == {'ADMIN_USER', 'ADMIN_PASS', 'SESSION_SECRET', 'VAULT_KEY'}
          assert cfg['main'] == 'control-room-worker.js'
          assert cfg['vars']['SIGNUP_OPEN'] == 'false'
          assert cfg['vars']['PROTECTED_WORKERS'] == 'website-management'
          assert cfg['observability']['enabled'] is True
          assert cfg['upload_source_maps'] is True
          assert cfg['observability']['traces']['enabled'] is True
          assert 0 < cfg['observability']['traces']['head_sampling_rate'] <= 0.1
          rate = cfg['observability']['logs']['head_sampling_rate']
          assert 0 < rate <= 1
          assert cfg['d1_databases'][0]['binding'] == 'DB'
          assert cfg['d1_databases'][0]['database_name'] == 'website-management-db'
          assert cfg['d1_databases'][0]['database_id'] == '897d585c-ced1-4b08-a478-603547f242e5'
          assert cfg['r2_buckets'][0]['bucket_name'] == 'website-management-files'
          assert len(cfg['d1_databases']) >= 1
          assert len(cfg['r2_buckets']) >= 1
          print('Account 4 production configuration checks passed')
          PY
      - name: Check for committed secrets and private keys
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          paths = [Path('wrangler.toml'), Path('control-room-worker.js')]
          patterns = [r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----', r'(?i)\b(?:api_key|secret_key|access_token)\s*=\s*["\x27](?:sk-|ghp_|github_pat_|cf_)[A-Za-z0-9_-]{12,}']
          for path in paths:
              value = path.read_text()
              for pattern in patterns:
                  assert not re.search(pattern, value), f'Potential credential in {path}'
          print('No matching embedded credentials found in checked files')
          PY
      - name: Reject committed environment and credential files
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import PurePosixPath
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          forbidden = []
          for name in filter(None, tracked):
              base = PurePosixPath(name).name
              if (base == '.env' or base.startswith('.env.') or base == '.dev.vars' or base.startswith('.dev.vars.')) and base not in ('.env.example', '.dev.vars.example'):
                  forbidden.append(name)
              if base in ('id_rsa', 'id_ed25519', 'credentials.json', 'service-account.json'):
                  forbidden.append(name)
          assert not forbidden, 'Sensitive filenames committed: ' + ', '.join(forbidden)
          print('No forbidden credential or environment files are tracked')
          PY
      - name: Enforce CI least-privilege protections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/account4-security-checks.yml').read_text()
          assert 'permissions:\n  contents: read' in workflow, 'Workflow must have read-only default permissions'
          assert 'persist-credentials: false' in workflow, 'Checkout credentials must not persist'
          assert '      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' in workflow, 'Checkout must be SHA pinned'
          assert '      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020' in workflow, 'Node setup action must be SHA pinned'
          assert '  push:\n    branches: [main]' in workflow, 'Main branch must be tested'
          for path in ('control-room-worker.js', 'workspace/**', 'security/**', 'cms/**', 'ai/**', 'scripts/**', 'tests/**', '.github/workflows/**'):
              assert workflow.count("      - '" + path + "'") == 2, 'Push and PR triggers must cover ' + path
          print('CI least-privilege and main-branch safeguards passed')
          PY
      - name: Check Worker syntax
        run: node --check control-room-worker.js
      - name: Validate Control Room workspace and security module syntax
        run: |
          find workspace security cms ai scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -r -n1 node --check
      - name: Validate Cloudflare Worker packaging without deployment
        run: npx --yes wrangler@4.136.0 deploy --dry-run --outdir /tmp/account4-worker-bundle
      - name: Validate production release antirollback rules
        run: node tests/account4-release-lineage.mjs
      - name: Refuse wrong-account Cloudflare deployments
        run: node tests/account4-exact-destination.mjs
      - name: Verify Control Room home navigation
        run: node tests/account4-home-actions.mjs
      - name: Verify AI permission draft behavior
        run: node tests/ai-permission-draft.mjs
      - name: Exercise exact AI Studio account selection
        run: node tests/ai-single-account-ui.mjs
      - name: Verify private Browser Agent service bindings
        run: node tests/browser-preflight-bindings.mjs
      - name: Test read-only Account 4 activation checks
        run: node tests/account4-activation-preflight.mjs
      - name: Test browser agent runtime readiness UI
        run: node tests/browser-readiness-ui.mjs
      - name: Test AI Studio readiness dashboard
        run: node tests/ai-studio-readiness-ui.mjs
      - name: Run Account 4 regression suite
        run: npm test
      - name: Run CMS editor DOM security and functionality checks
        run: npm run test:cms-dom
      - name: Verify CMS build succeeds
        run: npm run build:cms
      - name: Test Browser Agent server runtime and owner approval
        run: node tests/browser-agent.mjs
      - name: Verify generated integration sections
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const s=fs.readFileSync('control-room-worker.js','utf8'); for(const n of ['VISUAL CMS CLIENT','AI CAPABILITIES','AI PERMISSION CLIENT','AI WORKSPACE','OWNER PASSKEY SERVER','NATIVE WORKSPACE SERVER']) { if(s.split('// BEGIN '+n).length!==2||s.split('// END '+n).length!==2) throw Error('Invalid generated section: '+n); }"
      - name: Validate generated CMS Worker syntax and Cloudflare bundle
        run: |
          node --check control-room-worker.js
          npx --yes wrangler@4.136.0 deploy --dry-run --outdir /tmp/account4-generated-worker-bundle
      - name: Validate private Browser Agent Worker packaging
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @cloudflare/puppeteer@1.4.0
          npx --yes wrangler@4.136.0 deploy --config browser-agent/wrangler.jsonc --dry-run --outdir /tmp/account4-private-browser-bundle
