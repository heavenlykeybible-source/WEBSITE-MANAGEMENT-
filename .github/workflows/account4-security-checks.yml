name: Account 4 Security Checks
on:
  pull_request:
    paths:
      - 'control-room-worker.js'
      - 'tests/**'
      - 'schema.sql'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.toml'
      - '.github/workflows/account4-security-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies for high-severity vulnerabilities
        run: npm audit --audit-level=high
      - name: Validate production configuration safety
        run: |
          python3 - <<'PY'
          import tomllib
          with open('wrangler.toml', 'rb') as file:
              cfg = tomllib.load(file)
          assert cfg['name'] == 'website-management'
          assert cfg['main'] == 'control-room-worker.js'
          assert cfg['vars']['SIGNUP_OPEN'] == 'false'
          assert cfg['vars']['PROTECTED_WORKERS'] == 'website-management'
          assert cfg['observability']['enabled'] is True
          assert cfg['upload_source_maps'] is True
          assert cfg['observability']['traces']['enabled'] is True
          assert 0 < cfg['observability']['traces']['head_sampling_rate'] <= 0.1
          rate = cfg['observability']['logs']['head_sampling_rate']
          assert 0 < rate <= 1
          assert len(cfg['d1_databases']) >= 1
          assert len(cfg['r2_buckets']) >= 1
          print('Account 4 production configuration checks passed')
          PY
      - name: Check for committed secrets and private keys
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          paths = [Path('wrangler.toml'), Path('control-room-worker.js')]
          patterns = [r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----', r'(?i)\b(?:api_key|secret_key|access_token)\s*=\s*["\x27](?:sk-|ghp_|github_pat_|cf_)[A-Za-z0-9_-]{12,}']
          for path in paths:
              value = path.read_text()
              for pattern in patterns:
                  assert not re.search(pattern, value), f'Potential credential in {path}'
          print('No matching embedded credentials found in checked files')
          PY
      - name: Check Worker syntax
        run: node --check control-room-worker.js
      - name: Run Account 4 regression suite
        run: npm test
      - name: Run CMS editor DOM security and functionality checks
        run: npm run test:cms-dom
