name: Deploy Heavenly Key Website to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'heavenly-key-accounts/account-01-main-website/source/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-heavenly-key-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SITE_DIR: heavenly-key-accounts/account-01-main-website/source
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
    steps:
      - name: Checkout latest Website Management source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify website source and deployment configuration
        shell: bash
        run: |
          test -f "$SITE_DIR/index.html" || { echo '::error::Website index.html is missing'; exit 1; }
          test -d "$SITE_DIR/js" || { echo '::error::Website JavaScript folder is missing'; exit 1; }
          test -d "$SITE_DIR/css" || { echo '::error::Website CSS folder is missing'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID secret'; exit 1; }
          test -n "$CF_PAGES_PROJECT_NAME" || { echo '::error::Missing CLOUDFLARE_PAGES_PROJECT_NAME secret'; exit 1; }
      - name: Deploy Account 1 website to Cloudflare Pages
        shell: bash
        run: |
          npx --yes wrangler@4 pages deploy "$SITE_DIR" --project-name "$CF_PAGES_PROJECT_NAME" --branch main
