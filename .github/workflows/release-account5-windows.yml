name: Package Account 5 Signed Windows Release Candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-signed-candidate:
    runs-on: windows-latest
    timeout-minutes: 30
    environment: production-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Require Windows signing credentials
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.HKEM_WINDOWS_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.HKEM_WINDOWS_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PASSWORD)) {
            throw 'Windows code signing certificate and password must be configured as GitHub secrets'
          }
      - name: Restore and publish Windows x64 executable
        shell: pwsh
        working-directory: heavenly-key-accounts/account-05-heavenly-key-app/native/windows
        run: |
          dotnet restore HeavenlyKeyWindows.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish HeavenlyKeyWindows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./signed-candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and sign Windows MSIX release candidate
        shell: pwsh
        working-directory: heavenly-key-accounts/account-05-heavenly-key-app/native/windows
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.HKEM_WINDOWS_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.HKEM_WINDOWS_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'account5-windows.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
            $password = ConvertTo-SecureString $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
            $certificate = Get-PfxCertificate -FilePath $pfx -Password $password
            if (-not $certificate -or -not $certificate.HasPrivateKey -or (Get-Date) -gt $certificate.NotAfter) {
              throw 'Valid, non-expired code signing certificate required'
            }
            $msix = Join-Path (Resolve-Path '.').Path 'signed-candidate/HeavenlyKeyWindows.msix'
            ./package-msix.ps1 -Publisher $certificate.Subject -OutputPath $msix
            $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse -File | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1).FullName
            if (-not $signtool) { throw 'Windows SDK signtool is not installed' }
            & $signtool sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERT_PASSWORD /tr https://timestamp.digicert.com /td SHA256 $msix
            if ($LASTEXITCODE -ne 0) { throw 'MSIX signing failed' }
            & $signtool verify /pa /v $msix
            if ($LASTEXITCODE -ne 0) { throw 'MSIX signature verification failed' }
            $auth = Get-AuthenticodeSignature $msix
            if ($auth.Status -ne 'Valid') { throw "MSIX Authenticode verification failed: $($auth.Status)" }
            (Get-FileHash $msix -Algorithm SHA256).Hash | Out-File -Encoding ascii './signed-candidate/HeavenlyKeyWindows.msix.sha256'
          }
          finally {
            if (Test-Path $pfx) { Remove-Item $pfx -Force }
          }
      - name: Scan exact signed MSIX with Microsoft Defender
        shell: pwsh
        working-directory: heavenly-key-accounts/account-05-heavenly-key-app/native/windows
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = (Resolve-Path './signed-candidate/HeavenlyKeyWindows.msix').Path
          $status = Get-MpComputerStatus -ErrorAction Stop
          if (-not $status.AntivirusEnabled -or -not $status.RealTimeProtectionEnabled) {
            throw 'Microsoft Defender antivirus must be enabled to scan signed release'
          }
          Update-MpSignature -ErrorAction Stop
          Start-MpScan -ScanType CustomScan -ScanPath $msix -ErrorAction Stop
          $threats = @(Get-MpThreatDetection -ErrorAction Stop)
          if ($threats.Count -gt 0) { throw 'Defender reports threat detections; release blocked' }
          "malwareScan=passed" | Out-File -Encoding ascii './signed-candidate/HeavenlyKeyWindows.msix.security.txt'
      - name: Save signed release candidate for security and physical-device review
        uses: actions/upload-artifact@v4
        with:
          name: heavenly-key-account5-windows-signed-candidate
          path: |
            heavenly-key-accounts/account-05-heavenly-key-app/native/windows/signed-candidate/HeavenlyKeyWindows.msix
            heavenly-key-accounts/account-05-heavenly-key-app/native/windows/signed-candidate/HeavenlyKeyWindows.msix.sha256
            heavenly-key-accounts/account-05-heavenly-key-app/native/windows/signed-candidate/HeavenlyKeyWindows.msix.security.txt
          retention-days: 14
          if-no-files-found: error
