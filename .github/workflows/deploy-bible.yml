name: Deploy Heavenly Key Bible (Account 6)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: account6-bible-production
  cancel-in-progress: false
jobs:
  audit-and-deploy:
    runs-on: ubuntu-latest
    environment: account-6
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/heavenly-key-bible
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.BIBLE_CLOUDFLARE_API_TOKEN || secrets.ACCOUNT6_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.BIBLE_CLOUDFLARE_ACCOUNT_ID || secrets.ACCOUNT6_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the single approved homepage footer
        working-directory: ${{ github.workspace }}
        run: node scripts/cleanup/sync-footer.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/heavenly-key-bible/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate Worker bundle and all static assets
        run: npm run build
      - name: Audit Bible before deployment
        run: npm test
      - name: Preserve previous healthy existing Worker
        id: release_snapshot
        working-directory: .
        run: node scripts/test-existing-worker-release.mjs && node scripts/existing-worker-release.mjs snapshot
        env:
          RELEASE_WORKER: onlinebible
          RELEASE_ORIGIN: https://bible.heavenlykey.org/
      - name: Deploy Bible directly to Cloudflare from GitHub
        run: npx wrangler deploy --config bible/wrangler.toml --name onlinebible --keep-vars
      - name: Verify published scripture and homepage
        env:
          BIBLE_LIVE_URL: ${{ vars.BIBLE_LIVE_URL }}
        run: |
          if [ -n "$BIBLE_LIVE_URL" ]; then
            node bible/scripts/verify-live.mjs "$BIBLE_LIVE_URL"
          else
            echo '::warning::BIBLE_LIVE_URL is unset; live URL verification requires that variable.'
          fi
      - name: Verify release and restore previous version on failure
        if: always() && !cancelled() && steps.release_snapshot.outcome == 'success'
        working-directory: .
        run: node scripts/existing-worker-release.mjs verify
        env:
          RELEASE_WORKER: onlinebible
          RELEASE_ORIGIN: https://bible.heavenlykey.org/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onlinebible-previous-deployments
          path: .release-state/
          retention-days: 90
