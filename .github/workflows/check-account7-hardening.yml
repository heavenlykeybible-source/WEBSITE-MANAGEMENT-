name: Account 7 Radio security hardening checks
on:
  push:
    branches: [account7-security-hardening-20261031]
    paths:
      - 'heavenly-key-accounts/account-07-unverified/source/**'
      - 'tests/account7-security-headers.mjs'
      - 'tests/account7-radio.mjs'
      - '.github/workflows/check-account7-hardening.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run repository regression suite
        run: node tests/run.mjs
      - name: Run Account 7 player and proxy regressions
        run: node --experimental-vm-modules tests/account7-radio.mjs
      - name: Run Account 2 broadcast integration regressions
        run: node --experimental-strip-types tests/account2-radio.mjs
      - name: Verify Account 7 security headers and CSP
        run: node tests/account7-security-headers.mjs
