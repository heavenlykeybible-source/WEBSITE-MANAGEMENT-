name: SocialPlus release readiness
on:
  push:
    branches: [main]
    paths:
      - 'config/heavenly-key-accounts.json'
      - 'releases/socialplus/**'
      - 'tests/account-registry.mjs'
      - 'tests/socialplus-mobile-release.mjs'
      - '.github/workflows/socialplus-release.yml'
  pull_request:
    paths:
      - 'config/heavenly-key-accounts.json'
      - 'releases/socialplus/**'
      - 'tests/account-registry.mjs'
      - 'tests/socialplus-mobile-release.mjs'
      - '.github/workflows/socialplus-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/account-registry.mjs
      - run: node tests/socialplus-mobile-release.mjs
  manual-handoff:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/account-registry.mjs
      - run: node tests/socialplus-mobile-release.mjs
      - name: Prepare truthful Control Room review package
        run: |
          mkdir -p handoff
          cp releases/socialplus/mobile-release.json handoff/mobile-release.json
          cp config/heavenly-key-accounts.json handoff/account-registry.json
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('handoff/mobile-release.json')); fs.writeFileSync('handoff/STATUS.txt', 'Account 10 SocialPlus\\nRelease status: '+r.release_status+'\\nAndroid: '+r.android.status+'\\niOS: '+r.ios.status+'\\nPWA: '+r.pwa.status+'\\nMANUAL REVIEW ONLY — not deployed or approved\\n')"
          printf '%s\\n' "Commit: $GITHUB_SHA" "Control Room owner must review and approve any deployment." "This is a review/evidence package, not an application bundle." > handoff/README.txt
          sha256sum handoff/* > handoff/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: socialplus-account10-control-room-review
          path: handoff/
          retention-days: 30
  launch-gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/account-registry.mjs
      - run: node tests/socialplus-mobile-release.mjs --require-ready
      - run: node tests/socialplus-mobile-release.mjs --verify-live
      - name: Final manual approval reminder
        run: echo 'Validation passed; this workflow does not deploy. Owner approval in Control Room is still required.'
