name: SocialPlus release readiness
on:
  push:
    branches: [main]
    paths:
      - 'config/heavenly-key-accounts.json'
      - 'releases/socialplus/**'
      - 'tests/account-registry.mjs'
      - 'tests/socialplus-mobile-release.mjs'
      - '.github/workflows/socialplus-release.yml'
  pull_request:
    paths:
      - 'config/heavenly-key-accounts.json'
      - 'releases/socialplus/**'
      - 'tests/account-registry.mjs'
      - 'tests/socialplus-mobile-release.mjs'
      - '.github/workflows/socialplus-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/account-registry.mjs
      - run: node tests/socialplus-mobile-release.mjs
  manual-handoff:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/account-registry.mjs
      - run: node tests/socialplus-mobile-release.mjs --require-ready
      - run: node tests/socialplus-mobile-release.mjs --verify-live
      - name: Package Control Room manual-release evidence
        run: |
          mkdir -p handoff
          cp releases/socialplus/mobile-release.json handoff/mobile-release.json
          cp config/heavenly-key-accounts.json handoff/account-registry.json
          printf '%s\\n' "SocialPlus Account 10 — manual approval required" "Commit: $GITHUB_SHA" "This package is evidence only, not a deployed application." > handoff/README.txt
          sha256sum handoff/* > handoff/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: socialplus-account10-control-room-handoff
          path: handoff/
          retention-days: 30
  launch-gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/account-registry.mjs
      - run: node tests/socialplus-mobile-release.mjs --require-ready
      - run: node tests/socialplus-mobile-release.mjs --verify-live
