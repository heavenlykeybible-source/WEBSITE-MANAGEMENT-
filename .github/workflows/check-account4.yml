name: Check Account 4 Control Room
on:
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - 'heavenly-key-accounts/account-04-website-management-control-room/source/**'
      - '.github/workflows/check-account4.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: account4-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node tests/account4-permission-ui.mjs
      - run: npm run test:cms-dom
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:cms-browser
