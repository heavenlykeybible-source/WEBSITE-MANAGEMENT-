name: Verify Account 5 live app journeys
on:
  push:
    branches: [main]
    paths: ['tests/account5-live-browser.mjs', '.github/workflows/check-account5-live-browser.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy Account 5 Heavenly Key App']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: account5-live-browser-check
  cancel-in-progress: false
jobs:
  browser:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/account5-live-browser.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: account5-live-browser-failure
          path: browser-test-artifacts/
