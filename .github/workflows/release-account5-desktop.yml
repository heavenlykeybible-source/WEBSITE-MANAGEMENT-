name: Package Account 5 Signed Desktop Installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-15
            platform: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: heavenly-key-accounts/account-05-heavenly-key-app/native/desktop
        shell: bash
    env:
      CSC_LINK: ${{ matrix.platform == 'windows' && secrets.HKEM_WINDOWS_CSC_LINK || secrets.HKEM_MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ matrix.platform == 'windows' && secrets.HKEM_WINDOWS_CSC_KEY_PASSWORD || secrets.HKEM_MAC_CSC_KEY_PASSWORD }}
      APPLE_API_KEY_BASE64: ${{ secrets.HKEM_APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.HKEM_APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.HKEM_APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require owner signing certificate
        run: |
          set -euo pipefail
          test -n "$CSC_LINK" || { echo '::error::Owner desktop signing certificate is required'; exit 1; }
      - name: Prepare Apple notarization key
        if: matrix.platform == 'mac'
        run: |
          set -euo pipefail
          test -n "$APPLE_API_KEY_BASE64" && test -n "$APPLE_API_KEY_ID" && test -n "$APPLE_API_ISSUER"
          umask 077
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - name: Build signed native installer
        run: npm run package:release -- --publish never
      - name: Verify Windows signature and scan installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem dist -Filter '*.exe')
          if ($installers.Count -eq 0) { throw 'No installer produced' }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid installer signature: $($installer.Name)" }
            Update-MpSignature
            Start-MpScan -ScanType CustomScan -ScanPath $installer.FullName
            $threats = @(Get-MpThreatDetection | Where-Object { $_.Resources -match [regex]::Escape($installer.FullName) })
            if ($threats.Count -gt 0) { throw 'Installer malware scan failed' }
            Get-FileHash -Algorithm SHA256 $installer.FullName | Format-List | Out-File "$($installer.FullName).sha256.txt"
          }
      - name: Scan Mac installer and application
        if: matrix.platform == 'mac'
        run: |
          set -euo pipefail
          brew install clamav
          mkdir -p "$RUNNER_TEMP/clamav-db"
          printf 'DatabaseDirectory %s\nDatabaseMirror database.clamav.net\n' "$RUNNER_TEMP/clamav-db" > "$RUNNER_TEMP/freshclam.conf"
          freshclam --config-file="$RUNNER_TEMP/freshclam.conf"
          clamscan --database="$RUNNER_TEMP/clamav-db" --recursive --infected dist/
      - name: Verify Mac signature and notarization
        if: matrix.platform == 'mac'
        run: |
          set -euo pipefail
          for dmg in dist/*.dmg; do
            xcrun stapler validate "$dmg"
            shasum -a 256 "$dmg" > "$dmg.sha256"
          done
          for application in dist/mac*/Heavenly\ Key.app; do
            codesign --verify --deep --strict "$application"
            spctl --assess --type execute --verbose "$application"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: heavenly-key-signed-${{ matrix.platform }}-installers
          path: |
            heavenly-key-accounts/account-05-heavenly-key-app/native/desktop/dist/*.exe
            heavenly-key-accounts/account-05-heavenly-key-app/native/desktop/dist/*.dmg
            heavenly-key-accounts/account-05-heavenly-key-app/native/desktop/dist/*.sha256*
          if-no-files-found: error
          retention-days: 14
      - name: Remove notarization key
        if: always() && matrix.platform == 'mac'
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
