name: Account 9 VideoEditor quality gate
on:
  push:
    branches: [main]
    paths:
      - 'heavenly-key-accounts/account-09-heavenly-key-videoeditor/source/**'
      - 'scripts/build-account9-worker.mjs'
      - 'scripts/verify-account9-release.mjs'
      - 'release-packages/account9-control-room-full.mjs'
      - 'release-packages/account9-active-release.json'
      - 'scripts/account9-release-policy.mjs'
      - 'scripts/test-account9-release-policy.mjs'
      - 'scripts/smoke-account9-live.mjs'
      - 'scripts/test-account9-worker-health.mjs'
      - '.github/workflows/quality-account9-videoeditor.yml'
  pull_request:
    paths:
      - 'heavenly-key-accounts/account-09-heavenly-key-videoeditor/source/**'
      - 'scripts/build-account9-worker.mjs'
      - 'scripts/verify-account9-release.mjs'
      - 'release-packages/account9-control-room-full.mjs'
      - 'release-packages/account9-active-release.json'
      - 'scripts/account9-release-policy.mjs'
      - 'scripts/test-account9-release-policy.mjs'
      - 'scripts/smoke-account9-live.mjs'
      - 'scripts/test-account9-worker-health.mjs'
      - '.github/workflows/quality-account9-videoeditor.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: account9-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate app, syntax, backend and frontend
        working-directory: heavenly-key-accounts/account-09-heavenly-key-videoeditor/source
        run: npm run check
      - name: Build canonical Worker bundle
        run: node scripts/build-account9-worker.mjs /tmp/account9-quality-worker.mjs
      - name: Validate live launch checker syntax
        run: node --check scripts/smoke-account9-live.mjs
      - name: Enforce single Account 9 release identity
        run: node scripts/test-account9-release-policy.mjs
      - name: Verify freshly built Worker release matches latest source
        run: node scripts/verify-account9-release.mjs /tmp/account9-quality-worker.mjs
      - name: Validate packaged Worker JavaScript
        run: node --check /tmp/account9-quality-worker.mjs
      - name: Exercise packaged Worker health and auth boundaries
        run: node scripts/test-account9-worker-health.mjs /tmp/account9-quality-worker.mjs
      - name: Smoke-test packaged Worker static routes
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import worker from '/tmp/account9-quality-worker.mjs';
          const get = path => worker.fetch(new Request('https://video.example'+path), {});
          for (const [path,type] of [['/','text/html'],['/timeline.js','text/javascript'],['/sw.js','text/javascript'],['/offline-status.js','text/javascript'],['/hk-approved-footer.js','text/javascript'],['/hk-approved-footer.css','text/css'],['/manifest.json','application/json'],['/assets/logo-256.png','image/png']]) {
            const response=await get(path);
            assert.equal(response.status,200,path);
            assert.ok(response.headers.get('content-type')?.includes(type),path+' content type');
            assert.ok(response.headers.has('content-security-policy'),path+' security headers');
            assert.ok((await response.arrayBuffer()).byteLength>0,path+' body');
          }
          const release=(await get('/')).headers.get('x-heavenly-key-release');
          assert.match(release||'',/^account9-[a-f0-9]{16}$/,'Worker must expose a content-addressed release ID');
          const traversal=await get('/%2e%2e/%2e%2e/private');
          assert.equal(traversal.status,400,'Encoded traversal must be rejected');
          const missing=await get('/missing-account9-resource');
          assert.equal(missing.status,404);
          const headers=await worker.fetch(new Request('https://video.example/',{method:'HEAD'}),{});
          assert.equal(headers.status,200);
          assert.equal((await headers.arrayBuffer()).byteLength,0);
          const rejected=await worker.fetch(new Request('https://video.example/',{method:'POST'}),{});
          assert.equal(rejected.status,405);
          console.log('Account 9 Worker smoke tests passed.');
          JS
      - name: Preserve tested release for owner-approved deployment
        uses: actions/upload-artifact@v4
        with:
          name: account9-tested-worker
          path: /tmp/account9-quality-worker.mjs
          if-no-files-found: error
          retention-days: 7
