name: Connect Account 9 mediaeditor custom domain
on:
  push:
    branches: [main]
    paths: ['.github/workflows/connect-account9-mediaeditor.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: account9-mediaeditor-domain
  cancel-in-progress: false
jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: account9-staging
    steps:
      - name: Verify and attach mediaeditor to existing Worker
        env:
          CF_TOKEN: ${{ secrets.ACCOUNT9_CF_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const token=process.env.CF_TOKEN;
          if(!token)throw Error('Missing Account 9 API token. No change was made.');
          const base='https://api.cloudflare.com/client/v4/accounts/ceb3b48449319950191a4f6bae9b8b82/workers/domains';
          const headers={Authorization:'Bearer '+token,'Content-Type':'application/json'};
          async function api(path,method='GET',body){
            const response=await fetch(base+path,{method,headers,body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(20000),redirect:'error'});
            const data=await response.json().catch(()=>({success:false,errors:[]}));
            if(!response.ok||!data.success)throw Error('Cloudflare '+method+' domain failed (HTTP '+response.status+', codes '+JSON.stringify((data.errors||[]).map(e=>e.code))+').');
            return data.result;
          }
          const worker='heavenlykey-studio', hostname='mediaguru.heavenlykey.org';
          const domains=await api('');
          const current=domains.find(d=>d.hostname===hostname);
          if(current&&current.service!==worker)throw Error('Domain belongs to another Worker. Refusing to override existing route.');
          if(current?.enabled){
            console.log('PASS '+hostname+' already connected to '+worker);
          }else{
            const attached=await api('','PUT',{hostname,service:worker,zone_name:'heavenlykey.org',enabled:true,previews_enabled:false});
            if(attached.hostname!==hostname||attached.service!==worker)throw Error('Unexpected Cloudflare custom domain response.');
            console.log('PASS attached '+hostname+' to '+worker);
          }
          const verified=(await api('')).find(d=>d.hostname===hostname);
          if(!verified||verified.service!==worker||!verified.enabled)throw Error('Final domain-to-Worker verification failed.');
          console.log('PASS canonical Account 9 domain route verified');
          JS

# Recheck the Cloudflare Account 9 token and domain mapping after the owner updated permissions.

      - name: Diagnose live domain and conflicting DNS records
        if: always()
        env:
          CF_TOKEN: ${{ secrets.ACCOUNT9_CF_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const token=process.env.CF_TOKEN;
          const head={authorization:'Bearer '+token};
          async function inspect(url){
            const response=await fetch(url,{headers:head,signal:AbortSignal.timeout(14000)});
            const body=await response.json().catch(()=>null);
            return {ok:response.ok&&body?.success===true,result:body?.result,errorCodes:(body?.errors||[]).map(x=>x.code)};
          }
          const zones=await inspect('https://api.cloudflare.com/client/v4/zones?name=heavenlykey.org');
          if(!zones.ok){console.log('DNS ZONE READ NOT AUTHORIZED',JSON.stringify(zones.errorCodes));}
          else{
            const zone=(zones.result||[]).find(x=>x.name==='heavenlykey.org');
            if(!zone)console.log('ZONE NOT FOUND under authorized token');
            else{
              console.log('Zone status:',zone.status,'Cloudflare-assigned nameservers:',JSON.stringify(zone.name_servers||[]),'previous nameservers:',JSON.stringify(zone.original_name_servers||[]));
              const dns=await inspect('https://api.cloudflare.com/client/v4/zones/'+zone.id+'/dns_records?name=mediaguru.heavenlykey.org');
              if(dns.ok){
                for(const record of dns.result||[])console.log('Domain record:',JSON.stringify({id:record.id,type:record.type,proxied:record.proxied,content:record.type==='A'||record.type==='AAAA'?'[IP address masked]':record.content}));
              }else console.log('DNS RECORD READ NOT AUTHORIZED',JSON.stringify(dns.errorCodes));
            }
          }
          const publicSite=await fetch('https://mediaguru.heavenlykey.org/',{signal:AbortSignal.timeout(15000),redirect:'manual'}).catch(e=>({status:0,error:e.message}));
          console.log('Public origin HTTP:',publicSite.status,'location:',publicSite.headers?.get('location')||'');
          JS

      - name: Verify public MediaGuru routing and backend
        run: |
          node --input-type=module <<'JS'
          const origin='https://mediaguru.heavenlykey.org';
          for(const path of ['/','/api/health']){
            const response=await fetch(origin+path,{redirect:'error',cache:'no-store',signal:AbortSignal.timeout(20000)});
            if(response.status!==200)throw Error(path+' returned HTTP '+response.status);
            if(path==='/'){
              if(!(response.headers.get('content-type')||'').includes('text/html'))throw Error('Domain does not serve the editor HTML');
              if(!/^account9-[a-f0-9]{16}$/.test(response.headers.get('x-heavenly-key-release')||''))throw Error('Domain is not serving the canonical Account 9 Worker release');
            }else{
              const data=await response.json();
              if(data.status!=='ready')throw Error('Account 9 backend bindings or schema need repair');
            }
            console.log('PASS public '+path);
          }
          JS
