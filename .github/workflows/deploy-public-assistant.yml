name: Repair existing Heavenly Key public assistant
on:
  push:
    branches: [main]
    paths: ['public-assistant/**', 'scripts/deploy-public-assistant.mjs', '.github/workflows/deploy-public-assistant.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: heavenlykey-public-assistant
  cancel-in-progress: false
jobs:
  deploy:
    environment: account-4
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ACCOUNT4_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT4_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check public-assistant/worker.mjs
      - run: node scripts/deploy-public-assistant.mjs
