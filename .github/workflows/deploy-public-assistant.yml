name: Verify legacy Account 4 public assistant
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read legacy compatibility endpoint without deploying
        run: |
          node --input-type=module <<'JS'
          const r=await fetch('https://heavenlykey-cms-public.emmanuel2026miracle.workers.dev/health',{signal:AbortSignal.timeout(20000)});
          if(!r.ok)throw Error('Legacy assistant health HTTP '+r.status);
          console.log('Legacy assistant responds. Public assistant development targets Account 5; this workflow never uploads or deletes Workers.');
          JS
