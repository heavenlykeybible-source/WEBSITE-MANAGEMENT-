name: Deploy independent Account 5 small apps
on:
  workflow_dispatch:
    inputs:
      app:
        description: Independent application to deploy
        type: choice
        options: [all, walk-with-god, bible-study-portal, eternity-in-view, bible-reader, audio-bible, hymns, audio-hymns, daily-reading]
        default: all
permissions:
  contents: read
jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        app: [walk-with-god, bible-study-portal, eternity-in-view, bible-reader, audio-bible, hymns, audio-hymns, daily-reading]
    concurrency:
      group: account5-small-${{ matrix.app }}
      cancel-in-progress: false
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Build the single approved homepage footer
        working-directory: ${{ github.workspace }}
        run: node scripts/cleanup/sync-footer.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select only apps affected by this change
        id: changed
        run: node scripts/select-small-app-deployment.mjs
        env:
          SMALL_APP_ID: ${{ matrix.app }}
          BEFORE_SHA: ${{ github.event.before }}
          REQUESTED_APP: ${{ inputs.app }}
      - run: node --test tests/small-app-isolation.test.mjs
      - run: node scripts/deploy-account5-small-app.mjs
        if: steps.changed.outputs.deploy == 'true'
        env:
          SMALL_APP_ID: ${{ matrix.app }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.ACCOUNT5_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT5_CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: previous-${{ matrix.app }}-deployment
          path: .release-state/
          include-hidden-files: true
