name: Account 8 MeetingSpace tests
on:
  push:
    branches:
      - main
      - feature/account8-meetingspace-hardening-20261025
    paths:
      - 'zoom-studio/**'
      - 'scripts/existing-worker-release.mjs'
      - '.github/workflows/account8-meetingspace-tests.yml'
  pull_request:
    paths:
      - 'zoom-studio/**'
      - '.github/workflows/account8-meetingspace-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: account8-meetingspace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Node 22 backend and deployment regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: zoom-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Account 8 package scripts
        run: |
          node -e "const p=require('./package.json'); for (const s of ['test','bundle:control-room','configure']) if (!p.scripts?.[s]) process.exit(1)"
      - name: Verify JavaScript syntax
        run: |
          node --check scripts/configure.mjs
          node --check scripts/deploy.mjs
          node --check scripts/bundle-control-room.mjs
          node --check server/meeting-rooms.mjs
          node --check server/control-room-runtime.mjs
          node --check tests/control-room-package.test.mjs
          node --check tests/deployment.test.mjs
      - name: Backend and security regression tests
        run: npm test
      - name: Verify Control Room package build
        run: npm run bundle:control-room
      - name: Production dependency vulnerability audit
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm audit --audit-level=high --omit=dev
          else
            node -e "const p=require('./package.json'); if (Object.keys(p.dependencies||{}).length || Object.keys(p.optionalDependencies||{}).length) { console.error('Production dependencies require a lockfile for vulnerability scanning'); process.exit(1) }"
            echo "::notice::No production npm dependencies declared; dependency audit not applicable"
          fi
      - name: Check Account 8 deployment guard
        env:
          MEETINGSPACE_TARGET_ACCOUNT: '7'
        run: |
          if node scripts/configure.mjs; then
            echo "MeetingSpace must reject Account 7" >&2
            exit 1
          fi
