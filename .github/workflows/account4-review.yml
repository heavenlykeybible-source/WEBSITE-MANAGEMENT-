name: Account 4 Review Checks
on:
  pull_request:
    paths:
      - 'control-room-worker.js'
      - 'cms/**'
      - 'scripts/**'
      - 'migrations/**'
      - 'tests/**'
      - 'package*.json'
      - 'wrangler.toml'
      - '.github/workflows/account4-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - name: Validate Account 4 JavaScript syntax before tests
        run: |
          node --check scripts/account4-upload-policy.mjs
          node --check scripts/account4-r2-multipart.mjs
          node --check scripts/account4-import-d1.mjs
          node --check scripts/account4-import-workflow.mjs
          node --check scripts/account4-import-recovery.mjs
          node --check scripts/account4-import-reconcile.mjs
          node --check scripts/account4-import-publish-gate.mjs
          node --check scripts/account4-import-conditional-read.mjs
          node --check tests/account4-upload-policy.mjs
          node --check tests/account4-r2-multipart.mjs
          node --check tests/account4-import-d1.mjs
          node --check tests/account4-import-workflow.mjs
          node --check tests/account4-import-recovery.mjs
          node --check tests/account4-import-reconcile.mjs
          node --check tests/account4-import-publish-gate.mjs
          node --check tests/account4-import-conditional-read.mjs
      - run: node tests/account4-upload-policy.mjs
      - run: node tests/account4-r2-multipart.mjs
      - run: node tests/account4-import-d1.mjs
      - run: node tests/account4-import-workflow.mjs
      - run: node tests/account4-import-recovery.mjs
      - run: node tests/account4-import-reconcile.mjs
      - run: node tests/account4-import-publish-gate.mjs
      - run: node tests/account4-import-conditional-read.mjs
      - name: Validate Account 4 D1 migration constraints in SQLite
        run: python3 tests/account4-migration-smoke.py
      - run: npm test
      - run: npm run test:cms-dom
      - name: Install isolated browser-test dependencies
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: npm run test:cms-browser
