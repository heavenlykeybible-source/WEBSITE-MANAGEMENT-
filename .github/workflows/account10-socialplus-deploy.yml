name: Account 10 SocialPlus approved deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: socialplus-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: socialplus-production
    defaults:
      run:
        working-directory: account10-social-management
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ACCOUNT10_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT10_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm required deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing Cloudflare API token"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing Cloudflare account ID"; exit 1; }
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate source before production deployment
        run: npm run verify:local
      - name: Check remote D1 schema before deployment
        run: |
          npx wrangler d1 execute heavenlykey-social-management-db --remote --command "SELECT COUNT(*) AS total FROM social_posts"
          npx wrangler d1 execute heavenlykey-social-management-db --remote --command "SELECT media_id FROM social_posts LIMIT 1"
          npx wrangler d1 execute heavenlykey-social-management-db --remote --command "SELECT COUNT(*) AS total FROM conversations"
          npx wrangler d1 execute heavenlykey-social-management-db --remote --command "SELECT COUNT(*) AS total FROM webhook_events"
          npx wrangler d1 execute heavenlykey-social-management-db --remote --command "SELECT COUNT(*) AS total FROM social_accounts"
      - name: Confirm admin secret exists without revealing its value
        run: |
          npx wrangler secret list --name heavenly-key-social-management > worker-secrets.json
          node -e "const fs=require('fs');const raw=fs.readFileSync('worker-secrets.json','utf8');const list=JSON.parse(raw);if(!Array.isArray(list)||!list.some(x=>x.name==='ADMIN_TOKEN')){console.error('Missing Worker ADMIN_TOKEN secret');process.exit(1)}"
      - name: Deploy approved Worker with configured D1, R2 and assets
        run: npx wrangler deploy
      - name: Verify public health endpoint (not a launch-readiness claim)
        run: |
          curl --fail --show-error --silent --retry 3 --retry-delay 2 https://socialplus.heavenlykey.org/health > health.json
          node -e "const f=require('fs');const d=JSON.parse(f.readFileSync('health.json','utf8'));if(d.account!==10)process.exit(1)"
      - name: Smoke test production dashboard and static assets
        run: |
          curl --fail --show-error --silent --retry 3 --retry-delay 2 https://socialplus.heavenlykey.org/ > dashboard.html
          node -e "const fs=require('node:fs');const html=fs.readFileSync('dashboard.html','utf8');if(!html.includes('chatsTab')||!html.includes('postsTab')){console.error('Live dashboard is not the new SocialPlus app');process.exit(1)}"
          curl --fail --show-error --silent https://socialplus.heavenlykey.org/editorial-studio.js > editorial-live.js
          node --check editorial-live.js
      - name: Authenticated live database, media and draft API smoke tests
        env:
          ADMIN_SMOKE_TOKEN: ${{ secrets.ACCOUNT10_SMOKE_ADMIN_TOKEN }}
        run: |
          test -n "$ADMIN_SMOKE_TOKEN" || { echo "Missing smoke-test admin token secret"; exit 1; }
          curl --fail --show-error --silent --retry 3 -H "Authorization: Bearer $ADMIN_SMOKE_TOKEN" https://socialplus.heavenlykey.org/api/storage/readiness > storage-readiness.json
          node -e "const fs=require('node:fs');const d=JSON.parse(fs.readFileSync('storage-readiness.json','utf8'));for(const x of ['dbBound','mediaBound','assetsBound','databaseQueryOk','mediaBucketReadOk'])if(d[x]!==true){console.error('Missing or inaccessible storage:',x);process.exit(1)}"
          curl --fail --show-error --silent -H "Authorization: Bearer $ADMIN_SMOKE_TOKEN" https://socialplus.heavenlykey.org/api/posts > posts-smoke.json
          curl --fail --show-error --silent -H "Authorization: Bearer $ADMIN_SMOKE_TOKEN" https://socialplus.heavenlykey.org/api/posts/queue > queue-smoke.json
          node -e "const fs=require('node:fs');for(const file of ['posts-smoke.json','queue-smoke.json']){const d=JSON.parse(fs.readFileSync(file,'utf8'));if(!Array.isArray(d.items)||d.publishingConnected!==false){console.error('Unexpected or unsafe draft endpoint response',file);process.exit(1)}}"
      - name: Confirm unauthenticated API requests are rejected
        run: |
          status=$(curl --silent --output api-unauthorized.json --write-out '%{http_code}' https://socialplus.heavenlykey.org/api/posts)
          test "$status" = '401' || { echo "Unauthenticated API returned HTTP $status instead of 401"; exit 1; }
          node -e "const fs=require('node:fs');const d=JSON.parse(fs.readFileSync('api-unauthorized.json','utf8'));if(d.error!=='Unauthorized')process.exit(1)"
