name: Account 8 Private MeetingSpace one-time launch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/account8-one-time-private-launch-20261026.yml'
permissions:
  contents: read
concurrency:
  group: account8-private-meetingspace-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Account 8 application
        run: npm test --prefix zoom-studio
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: account8-meetingspace-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Deploy isolated Account 8 restricted preview
        working-directory: zoom-studio
        env:
          MEETINGSPACE_TARGET_ACCOUNT: '8'
          MEETINGSPACE_PRIVATE_PREVIEW: '1'
          CLOUDFLARE_API_TOKEN: ${{ secrets.MEETINGSPACE_ACCOUNT8_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.MEETINGSPACE_ACCOUNT8_CLOUDFLARE_ID }}
          MEETINGSPACE_ACCOUNT8_CLOUDFLARE_ID: ${{ secrets.MEETINGSPACE_ACCOUNT8_CLOUDFLARE_ID }}
          STUDIO_D1_DATABASE_ID: ${{ secrets.MEETINGSPACE_ACCOUNT8_D1_DATABASE_ID }}
          MEETINGSPACE_ACCOUNT8_DATABASE_CONFIRMED: '1'
          MEETINGSPACE_SHARED_CLOUDFLARE_ACCOUNT: '1'
          MEETINGSPACE_ACCOUNT8_RELEASE_ORIGIN: 'https://meeting.heavenlykey.org'
        run: npm run deploy
