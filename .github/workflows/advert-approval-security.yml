name: Advert owner-approval security checks
on:
  pull_request:
    paths:
      - 'apps/global-christian-community/src/adverts.ts'
      - 'tests/advert-approval-security.mjs'
      - '.github/workflows/advert-approval-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check owner-advert guardrails
        run: node --test tests/advert-approval-security.mjs
