name: Deploy Account 5 Heavenly Key App

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: account5-production-deploy
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    defaults:
      run:
        working-directory: heavenly-key-accounts/account-05-heavenly-key-app/source
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ACCOUNT5_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT5_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the single approved homepage footer
        working-directory: ${{ github.workspace }}
        run: node scripts/cleanup/sync-footer.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify app source and assets
        run: npm run build
      - name: Run app tests
        run: npm test
      - name: Confirm isolated Account 5 credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing ACCOUNT5_CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing ACCOUNT5_CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Apply private Account 5 download statistics migrations
        run: npx --no-install wrangler d1 migrations apply heavenly-key-download-counts --remote --config wrangler.toml

      - name: Preserve previous healthy existing Worker
        id: release_snapshot
        working-directory: .
        run: node scripts/test-existing-worker-release.mjs && node scripts/existing-worker-release.mjs snapshot
        env:
          RELEASE_WORKER: heavenly-key-app
          RELEASE_ORIGIN: https://heavenly-key-app.heavenlykeyapp.workers.dev/
      - name: Publish Account 5 Worker
        run: npx --no-install wrangler deploy --config wrangler.toml --name heavenly-key-app --keep-vars
      - name: Verify release and restore previous version on failure
        if: always() && !cancelled() && steps.release_snapshot.outcome == 'success'
        working-directory: .
        run: node scripts/existing-worker-release.mjs verify
        env:
          RELEASE_WORKER: heavenly-key-app
          RELEASE_ORIGIN: https://heavenly-key-app.heavenlykeyapp.workers.dev/
      - name: Verify public app page and all standalone app routes
        working-directory: .
        run: node scripts/verify-account5-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heavenly-key-app-previous-deployments
          path: .release-state/
          retention-days: 90
