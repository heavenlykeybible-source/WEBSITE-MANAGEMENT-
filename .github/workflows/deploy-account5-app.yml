name: Deploy Account 5 Heavenly Key App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'heavenly-key-accounts/account-05-heavenly-key-app/source/**'
      - '.github/workflows/deploy-account5-app.yml'

permissions:
  contents: read

concurrency:
  group: account5-production-deploy
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    defaults:
      run:
        working-directory: heavenly-key-accounts/account-05-heavenly-key-app/source
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ACCOUNT5_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT5_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify app source and assets
        run: npm run build
      - name: Run app tests
        run: npm test
      - name: Confirm isolated Account 5 credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing ACCOUNT5_CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing ACCOUNT5_CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Publish Account 5 Worker
        run: npx --no-install wrangler deploy --config wrangler.toml --keep-vars
