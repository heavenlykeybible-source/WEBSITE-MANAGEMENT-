name: Cloudflare domain operations tests
on:
  push:
    paths:
      - 'integrations/cloudflare-domain-operations.mjs'
      - 'tests/cloudflare-domain-operations.test.mjs'
      - '.github/workflows/test-cloudflare-domain-operations.yml'
  pull_request:
    paths:
      - 'integrations/cloudflare-domain-operations.mjs'
      - 'tests/cloudflare-domain-operations.test.mjs'
      - '.github/workflows/test-cloudflare-domain-operations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  domain-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated domain permission tests (mocked Cloudflare API)
        run: node --test tests/cloudflare-domain-operations.test.mjs
