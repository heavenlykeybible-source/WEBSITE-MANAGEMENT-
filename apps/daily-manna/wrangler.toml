# Independent Strength for Today application (Account 1).
# Staging D1 verified on Cloudflare Account 1. Apply schema.sql before deployment.
name = "strength-for-today-manna-staging"
main = "worker.mjs"
compatibility_date = "2026-10-18"
workers_dev = true

[triggers]
crons = ["0 * * * *"]

# Set EDITOR_TOKEN with: npx wrangler secret put EDITOR_TOKEN
[[d1_databases]]
binding = "DB"
database_name = "strength-for-today-manna-staging"
database_id = "567e1b66-6fe4-460c-b67a-8bafec52eacd"

# Owner-uploaded pictures use a dedicated PRIVATE R2 bucket.
# Dedicated R2 bucket verified on Cloudflare Account 1.
[[r2_buckets]]
binding = "MANNA_IMAGES"
bucket_name = "strength-for-today-manna-images-staging"

# Publication is scheduled even when manual editorial review is incomplete.
# This staging setting is requested by the owner. Do not import or deploy
# unverified content to production before the source material is cleared.
[vars]
ALLOW_UNREVIEWED_PUBLICATION = "true"
# Studio publishing bridge: set STUDIO_BRIDGE_SECRET using `wrangler secret put`.
# Do not configure the shared secret or launch date until the Studio ingress
# migration and route are deployed on the existing Heavenly Key platform.
# STUDIO_BRIDGE_ORIGIN must be the HTTPS origin of the existing Heavenly Key Core Worker.
# MANNA_PUBLIC_ORIGIN must be the verified public Daily Manna domain.
# STUDIO_FIRST_POST_DATE (YYYY-MM-DD) is an explicit owner launch gate.
# All these are intentionally left unset: no social posts are sent before verification.
