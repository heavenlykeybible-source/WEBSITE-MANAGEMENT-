<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Old Time Gospel Revival Hymn Book</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5ead5;font-family:Georgia,serif;color:#2d2020}.app{max-width:1100px;margin:auto;border:7px solid #79051b;border-radius:24px;overflow:hidden;background:#fff7e8}.hero{background:linear-gradient(130deg,#590012,#940a25);color:#ffe1a0;text-align:center;padding:24px}.hero h1{font-size:clamp(25px,4vw,45px);margin:10px}.flags{display:inline-flex;width:62px;height:62px;border:2px solid gold;border-radius:50%;align-items:center;justify-content:center;background:#fff;font-size:23px}.search{display:flex;padding:14px;gap:8px}.search input{flex:1;min-width:0;padding:13px;border:2px solid #a65c60;border-radius:9px;font-size:16px}button{font:inherit;cursor:pointer;border:1px solid #caa269;border-radius:9px;padding:10px;background:#fff2da;color:#760019}.primary,.active{background:#79051b!important;color:white!important}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px}.layout{display:grid;grid-template-columns:32% 1fr;gap:12px;padding:12px}.nav{border:1px solid #dec69e;border-radius:12px;overflow:hidden;align-self:start}.nav button{display:block;width:100%;border:0;border-bottom:1px solid #e9d9be;border-radius:0;text-align:left}.reader{border:5px double #79051b;border-radius:20px;padding:24px;text-align:center;background:#fffaf0}.reader h2{font-size:clamp(27px,4vw,43px);color:#79051b}.verse{white-space:pre-line;line-height:1.6;margin:25px auto}.verse b{display:block;color:#79051b}.chorus{background:#f7e6c5;border:1px solid #d2a043;border-radius:14px;padding:16px}.credits{font-size:13px;color:#76573b}.actions{justify-content:center}footer{background:#79051b;color:#ffe2a1;text-align:center;padding:18px}@media(max-width:650px){.layout{grid-template-columns:1fr}.nav{max-height:185px;overflow:auto}.reader{padding:14px}}@media print{.nav,.tabs,.search,.actions{display:none}.layout{display:block}}
</style><main class="app"><header class="hero"><span class="flags" aria-label="Nations flags">🇳🇬🇬🇭<br>🇺🇸🇬🇧</span><h1>OLD TIME GOSPEL REVIVAL<br>HYMN BOOK</h1><div>TOGETHER WE TAKE CHRIST TO THE NATIONS OF THE WORLD.</div><div>HEAVENLY KEY EVANGELISTIC MOVEMENT</div></header><form class="search" id="form"><input id="q" placeholder="Search by number, name or subject" aria-label="Search hymns"><button class="primary">Search</button></form><div class="tabs"><button data-tab="all" class="active">All Hymns</button><button data-tab="subject">By Subject</button><button data-tab="fav">Favourites</button></div><div class="layout"><nav class="nav" id="nav"></nav><article class="reader" id="reader"></article></div><div class="actions"><button id="prev">Previous</button><button id="fav">♡ Favourite</button><button id="share" class="primary">Share Hymn</button><button id="print">Print</button><button id="next" class="primary">Next</button><button id="minus">A−</button><button id="plus">A+</button></div><footer>Share this app to bless others.<br>Together we take Christ to the nations of the world.</footer></main><script>
const songs=[{id:1,title:"Revive Us Again",subject:"Revival & Spiritual Awakening",writer:"William P. Mackay",composer:"John J. Husband",verses:["We praise Thee, O God! for the Son of Thy love,|For Jesus who died, and is now gone above.","We praise Thee, O God! for Thy Spirit of light,|Who has shown us our Saviour, and scattered our night."],chorus:"Hallelujah! Thine the glory,|Hallelujah! Amen;|Hallelujah! Thine the glory,|Revive us again."},{id:2,title:"To God Be the Glory",subject:"Thanksgiving & Praise",writer:"Fanny J. Crosby",composer:"William H. Doane",verses:["To God be the glory, great things He hath done!|So loved He the world that He gave us His Son,|Who yielded His life an atonement for sin,|And opened the life-gate that all may go in."],chorus:"Praise the Lord, praise the Lord,|Let the earth hear His voice!|Praise the Lord, praise the Lord,|Let the people rejoice!"},{id:3,title:"Come, Holy Spirit, Heavenly Dove",subject:"Holy Ghost Baptism & Power",writer:"Isaac Watts",composer:"Traditional tunes",verses:["Come, Holy Spirit, heavenly Dove,|With all Thy quickening powers;|Kindle a flame of sacred love|In these cold hearts of ours."],chorus:""}];
let current=1,tab="all",size=21;const favs=new Set(),$=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));function render(){let q=$("q").value.trim().toLowerCase();let list=songs.filter(s=>(tab!=="fav"||favs.has(s.id))&&(!q||String(s.id)===q||s.title.toLowerCase().includes(q)||s.subject.toLowerCase().includes(q)));$("nav").innerHTML=list.map(s=>'<button data-id="'+s.id+'" class="'+(s.id===current?'active':'')+'">'+s.id+' — '+esc(s.title)+(tab==="subject"?'<small> · '+esc(s.subject)+'</small>':'')+'</button>').join("")||'<p>No hymns found</p>';let s=songs.find(x=>x.id===current);$("reader").innerHTML='<div class="credits">HYMN '+s.id+' · '+esc(s.subject)+'</div><h2>'+esc(s.title.toUpperCase())+'</h2><p class="credits">Words: '+esc(s.writer)+' · Music: '+esc(s.composer)+'</p>'+s.verses.map((v,i)=>'<div class="verse"><b>VERSE '+(i+1)+'</b>'+esc(v).replaceAll('|','<br>')+'</div>'+(i===0&&s.chorus?'<div class="verse chorus"><b>CHORUS</b>'+esc(s.chorus).replaceAll('|','<br>')+'</div>':'')).join("");$("reader").style.fontSize=size+"px";$("fav").textContent=favs.has(current)?"♥ Saved":"♡ Favourite";document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));history.replaceState(null,"","#hymn-"+current)}
$("nav").onclick=e=>{let b=e.target.closest("[data-id]");if(b){current=+b.dataset.id;render()}};$("form").onsubmit=e=>{e.preventDefault();let n=Number($("q").value.trim());if(songs.some(s=>s.id===n))current=n;render()};document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$("prev").onclick=()=>{current=Math.max(1,current-1);render()};$("next").onclick=()=>{current=Math.min(songs.length,current+1);render()};$("fav").onclick=()=>{favs.has(current)?favs.delete(current):favs.add(current);render()};$("minus").onclick=()=>{size=Math.max(16,size-2);render()};$("plus").onclick=()=>{size=Math.min(32,size+2);render()};$("print").onclick=()=>window.print();$("share").onclick=async()=>{let s=songs.find(x=>x.id===current),data={title:s.title,text:"Share this app to bless others. Together we take Christ to the nations of the world.",url:location.href};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(data.url);alert("Hymn link copied")}}catch(e){if(e.name!=="AbortError")alert("Sharing unavailable")}};let match=location.hash.match(/hymn-(\d+)/);if(match&&songs.some(s=>s.id===+match[1]))current=+match[1];render();
</script></html>
