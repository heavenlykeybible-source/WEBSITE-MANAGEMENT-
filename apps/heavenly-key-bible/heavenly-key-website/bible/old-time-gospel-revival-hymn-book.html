const verifiedTextUrl=new URL("./data/hymns.json",location.href).pathname;
function parseHistoricalLyrics(raw){
 const parts=String(raw).split(/\n\s*\n/),verses=[],choruses=[];
 for(const part of parts){const lines=part.split("\n");if(/^chorus\s*:/i.test(lines[0])){choruses.push(lines.join("|").replace(/^chorus\s*:\|?/i,""));continue}
 verses.push(lines.join("|").replace(/^\d+\s+/,"").replace(/\s*\[Chorus\]/gi,""))}

}
async function loadHistoricalTexts(){
 try{const response=await fetch(verifiedTextUrl,{cache:"default"});if(!response.ok)throw Error("Hymn data unavailable");

 let song=songs.find(x=>x.title.toLowerCase().replace(/[^a-z0-9]/g,"")===key);
 if(!song){song={id:songs.length+1,title:h.title,subject:"Salvation & Repentance",writer:h.author||"Unknown",composer:"Not documented",verses:[],chorus:""};songs.push(song)}

 if(changed){render();}
 }catch(error){console.warn("Historical hymn texts could not load",error)}
}
