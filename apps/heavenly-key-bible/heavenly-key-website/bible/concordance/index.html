<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Holy Bible Concordance</title><style>*{box-sizing:border-box}body{background:#fff0f0;color:#222;font:16px/1.6 system-ui;margin:0;padding:16px}main{max-width:900px;margin:auto;padding:18px;border:2px solid #2454ad;border-radius:16px}header{background:#2454ad;color:#fff;padding:18px;text-align:center;border-radius:10px}h1{font-size:24px;margin:0}header p{margin:4px}label{font-weight:700}select,button{font:inherit;padding:9px;border:1px solid #2454ad;border-radius:8px;background:#fff;min-height:44px}select{width:100%}.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}.scripture,.detail{padding:16px;background:#fffafa;border:1px solid #e7bcbc;border-radius:10px;margin:14px 0}.scripture h2{color:#982d43}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tabs button{font-weight:800;background:#dce9ff}.tabs button:nth-child(2){background:#e3efe9}.tabs button:nth-child(3){background:#fff0c9}.tabs [aria-selected=true]{border:3px solid #2454ad}.actions{display:flex;flex-wrap:wrap;gap:8px}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #e9a000}@media(max-width:500px){body{padding:8px}main{padding:10px}.tabs button{font-size:14px;padding:5px}}</style></head><body><main><header><h1>HOLY BIBLE CONCORDANCE</h1><p>AUTHORISED KING JAMES VERSION</p><p>Verse-by-Verse Scripture Study</p></header><p><a href="../">Back to Holy Bible</a></p><div class="pick"><label>Book<select id="book"></select></label><label>Chapter<select id="chapter"></select></label><label>Verse<select id="verse"></select></label></div><p id="status" role="status"></p><section class="scripture"><h2 id="ref"></h2><p id="passage"></p></section><div class="tabs" role="tablist"><button data-tab="explanation" aria-selected="true">Explanation</button><button data-tab="context" aria-selected="false">Context</bu
