services:
  browser-engine:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      MAX_JOBS: "2"
      BROWSER_ENGINE_KEY: ${BROWSER_ENGINE_KEY:?Set BROWSER_ENGINE_KEY in environment}
      BROWSER_ENGINE_STATE_FILE: /data/browser-jobs.json
    volumes:
      - browser-data:/data
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
volumes:
  browser-data:
