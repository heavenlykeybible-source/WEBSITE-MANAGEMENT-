<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Heavenly Key Studio</title><link rel="stylesheet" href="/css/shell.css"></head><body><main class="signin-layout"><p class="eyebrow">HEAVENLY KEY STUDIO</p><h1>Welcome back</h1><p>Continue from your control room or use your existing owner or admin password.</p><a class="btn" href="/auth/start">Continue with control room</a><div class="signin-divider">or sign in here</div><form id="signin-form"><label>Username or email<input name="user" autocomplete="username" required autocapitalize="none" spellcheck="false" placeholder="Owner or admin username"></label><label>Password<input name="pass" type="password" autocomplete="current-password" required maxlength="128"></label><button type="button" id="show-password" aria-pressed="false">Show password</button><button id="signin-submit">Sign in</button><p id="signin-status" role="status" aria-live="polite"></p></form><p>Use the same credentials as the control room. Your existing password stays there.</p><a href="https://heavenlykey.org/">Go back to the main website</a></main><script type="module" src="/js/signin.js"></script></body></html>
