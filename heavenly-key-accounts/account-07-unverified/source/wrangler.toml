name = "heavenlykeyradio"
main = "_worker.js"
compatibility_date = "2026-10-31"
keep_vars = true
workers_dev = true

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Configure MEDIA_PUBLIC_ORIGIN in the Cloudflare Worker settings after confirming
# the exact Account 2 HTTPS origin. Do not guess it or commit credentials.
# Account 2 public broadcast routes authenticate this edge proxy using the
# fixed X-Heavenly-Key-Internal: media-engine-public-v1 integration marker.
# No Account 2 secrets, database bindings, or storage resources belong in Account 7.
