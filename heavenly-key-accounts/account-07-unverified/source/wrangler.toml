name = "heavenlykeyradio"
main = "_worker.js"
compatibility_date = "2026-10-23"
keep_vars = true
workers_dev = true

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/broadcast/*"]

# Existing Worker secrets and variables are retained by --keep-vars.
# Account 2 is the broadcast source; Account 4 is not involved.
# MEDIA_PUBLIC_ORIGIN: verified Account 2 HTTPS origin.
# RADIO_PUBLIC_API_KEY: server-only secret shared with Account 2.
