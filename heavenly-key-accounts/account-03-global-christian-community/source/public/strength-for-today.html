uest(path,method='GET',body){const res=await fetch(path,{method,credentials:'same-origin',headers:{'Accept':'application/json',...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});let data={};try{data=await res.json()}catch{}if(!res.ok)throw Error(data?.error?.message||'Request failed ('+res.status+')');return data}async function authenticated(){try{const me=await request('/api/me');if(me?.user?.status==='active')return true}catch{}$('sharing-status').textContent='Please sign in to share. Opening the account page.';location.href='account.html';return false}const sharing=$('sharing-status');$('feed').onclick=async()=>{if(!await authenticated())return;if(!confirm('Publish this devotional on the public Global Christian Social Network feed?'))return;const button=$('feed');button.disabled=true;sharing.textContent='Publishing…';try{await request('/api/posts','POST',{postFormat:'plain_text',designCategory:'faith',title:items[current][0],body:text(),scripture:items[current][1],postType:'post',visibility:'public'});sharing.textContent='Devotional published successfully.'}catch(e){sharing.textContent='Unable to publish: '+e.message}finally{button.disabled=false}};const selector=document.createElement('section');selector.className='card';selector.hidden=true;selector.innerHTML='<h2>Send Strength to Members</h2><label for="member-query">Find members by name</label><input id="member-query" type="search" maxlength="100" placeholder="Search members" style="width:100%;padding:12px"><button id="find-members" type="button">Find Members</button><div id="member-results"></div><p id="selected-members"></p><button id="send-selected" type="button">Send to Selected Members</button><button id="close-selector" type="button">Close</button>';sharing.after(selector);const selected=new Map();const results=selector.querySelector('#member-results'),summary=selector.querySelector('#selected-members');function updateSelection(){summary.textContent=selected.size+' selected (maximum 10).'}selector.querySelector('#close-selector').onclick=()=>{selector.hidden=true};$('members').onclick=async()=>{if(!await authenticated())return;selector.hidden=false;selector.scrollIntoView({behavior:'smooth',block:'start'});};selector.querySelector('#find-members').onclick=async()=>{results.textContent='Searching…';try{const query=selector.querySelector('#member-query').value.trim();if(query.length<2){results.textContent='Enter at least two characters.';return}const data=await request('/api/discover?q='+encodeURIComponent(query));results.replaceChildren();for(const member of (data.items||[]).slice(0,20)){const id=Number(member.user_id);if(!Number.isSafeInteger(id)||id<=0)continue;const label=document.createElement('label');label.style.cssText='display:block;padding:10px;border-bottom:1px solid #ddd';const cb=document.createElement('input');cb.type='checkbox';cb.checked=selected.has(id);cb.onchange=()=>{if(cb.checked){if(selected.size>=10){cb.checked=false;sharing.textContent='Choose no more than 10 members per batch.';return}selected.set(id,member.display_name||'Member')}else selected.delete(id);updateSelection()};label.append(cb,document.createTextNode(' '+(member.display_name||'Member')));results.append(label)}if(!results.children.length)results.textContent='No matching members found.'}catch(e){results.textContent='Search failed: '+e.message}};selector.querySelector('#send-selected').onclick=async()=>{if(!selected.size){sharing.textContent='Select at least one member.';return}if(!confirm('Send this devotional to '+selected.size+' selected member(s)? Existing message-request and privacy rules apply.'))return;const button=selector.querySelector('#send-selected');button.disabled=true;let sent=0,requested=0,failed=0;for(const [id] of selected){try{const convo=await request('/api/messages/requests','POST',{recipientUserId:id});if(convo.status==='accepted'&&convo.conversation_id){await request('/api/messages/'+encodeURIComponent(convo.conversation_id),'POST',{body:text(),clientRequestId:crypto.randomUUID()});sent++}else requested++}catch{failed++}}sharing.textContent=sent+' delivered; '+requested+' message requests pending acceptance; '+failed+' unsuccessful. Pending requests do not deliver the devotional until accepted.';button.disabled=false};$('download').onclick=()=>{const c=document.createElement('canvas');c.width=1200;c.height=630;const g=c.getContext('2d');g.fillStyle='#09378c';g.fillRect(0,0,c.width,c.height);g.fillStyle='#fff';g.font='bold 48px sans-serif';g.fillText('STRENGTH FOR TODAY',45,90);g.font='bold 32px sans-serif';g.fillText(items[current][0],45,155);g.font='27px sans-serif';g.fillText(items[current][1]+' (KJV)',45,210);const words=items[current][2].split(' ');let line='',y=280;for(const w of words){if(g.measureText(line+' '+w).width>1100){g.fillText(line,45,y);line=w;y+=43}else line+=(line?' ':'')+w}g.fillText(line,45,y);g.font='22px sans-serif';g.fillText('Together we take Christ to the Nations of the World',45,585);const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='strength-for-today.png';a.click()};
