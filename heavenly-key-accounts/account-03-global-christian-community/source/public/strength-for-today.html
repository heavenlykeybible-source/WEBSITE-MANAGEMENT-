<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Strength for Today | Global Christian Social Network</title><style>body{margin:0;background:#e9f2ff;font:16px system-ui;color:#102b59}header{padding:38px 18px;text-align:center;color:white;background:linear-gradient(120deg,#082d93,#d50019,#e8a800)}h1{font-size:clamp(32px,6vw,65px);margin:0}main{max-width:1060px;margin:auto;padding:20px}nav a{color:white}#topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.topic{border:0;border-radius:14px;color:white;font-weight:700;min-height:90px;cursor:pointer;background:var(--c);padding:10px;font-size:16px}.topic[aria-pressed=true]{outline:4px solid #ffcd00;outline-offset:2px}.card{background:white;border-radius:20px;padding:25px;margin:20px 0;box-shadow:0 6px 22px #16386c24}.actions{display:flex;flex-wrap:wrap;gap:10px}.actions button,.actions a{border:0;border-radius:10px;padding:13px;cursor:pointer;font-weight:700;background:#103fa6;color:white;text-decoration:none}.actions .red{background:#ce001c}.actions .yellow{background:#ffd11d;color:#151b3c}textarea{width:100%;min-height:80px;box-sizing:border-box}small{display:block;margin-top:12px}footer{text-align:center;padding:30px;background:#062d75;color:white}</style></head><body><header><nav><a href="index.html">← Social Network Home</a></nav><h1>STRENGTH FOR TODAY</h1><p>DAILY SPIRITUAL ENCOURAGEMENT</p><strong>GOD’S WORD FOR EVERY SEASON OF LIFE</strong></header><main><h2>CHOOSE YOUR SPIRITUAL STRENGTH</h2><div id="topics"></div><div class="actions" style="margin-top:18px"><button class="yellow" id="surprise">🔀 Surprise Me</button></div><article class="card" aria-live="polite"><p id="date"></p><h2 id="heading"></h2><h3 id="reference"></h3><blockquote id="verse"></blockquote><h3>TODAY’S ENCOURAGEMENT</h3><p id="encouragement"></p><h3>TODAY’S PRAYER</h3><p id="prayer"></p><label for="note">My reflection</label><t ];const colors=['#cb0018','#004cce','#c88300','#7200bb','#008a43','#c50000','#0058d0','#bd0074','#bd6200','#006b7e','#0642bb','#b40000'];let current=0;const $=id=>document.getElementById(id),day=new Date(),dayKey=day.getFullYear()+'-'+(day.getMonth()+1)+'-'+day.getDate();$('date').textContent=day.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});function render(i){current=i;const a=items[i];$('heading').textContent=a[0];$('reference').textContent=a[1]+' (KJV)';$('verse').textContent='“'+a[2]+'”';$('encouragement').textContent=a[3];$('prayer').textContent=a[4];$('note').value=localStorage.getItem('strength-note-'+i)||'';document.querySelectorAll('.topic').forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));$('status').textContent='';}items.forEach((a,i)=>{let b=document.createElement('button');b.className='topic';b.textContent=a[0];b.style.setProperty('--c',colors[i]);b.onclick=()=>render(i);$('topics').append(b)});function text(){const a=items[current];return a[0]+'\n'+a[1]+' (KJV)\n'+a[2]+'\n\n'+a[3]+'\n\nPrayer: '+a[4]+'\n\nTogether we take Christ to the Nations of the World';}render(Math.floor(Date.UTC(day.getFullYear(),day.getMonth(),day.getDate())/86400000)%items.length);$('surprise').onclick=()=>render((current+1+Math.floor(Math.random()*(items.length-1)))%items.length);$('save').onclick=()=>{try{localStorage.setItem('strength-note-'+current,$('note').value);$('status').textContent='Reflection saved on this device.'}catch{$('status').textContent='Unable to save on this device.'}};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(text());$('status').textContent='Copied.'}catch{$('status').textContent='Copy is unavailable in this browser.'}};$('external').onclick=async()=>{if(navigator.share){try{await navigator.share({title:'Strength for Today',text:text()})}catch{}}else{$('copy').click();$('sharing-status').textContent='Text copied; paste it into your chosen social network.'}};$('feed').onclick=()=>{$('sharing-status').textContent='Feed publishing requires the authenticated Account 3 post composer. Copy the devotional and share it from your feed.'};$('members').onclick=()=>{$('sharing-status').textContent='Member delivery requires the authenticated messaging API. Copy the devotional and open Messages.'};$('download').onclick=()=>{const c=document.createElement('canvas');c.width=1200;c.height=630;const g=c.getContext('2d');g.fillStyle='#09378c';g.fillRect(0,0,c.width,c.height);g.fillStyle='#fff';g.font='bold 48px sans-serif';g.fillText('STRENGTH FOR TODAY',45,90);g.font='bold 32px sans-serif';g.fillText(items[current][0],45,155);g.font='27px sans-serif';g.fillText(items[current][1]+' (KJV)',45,210);const words=items[current][2].split(' ');let line='',y=280;for(const w of words){if(g.measureText(line+' '+w).width>1100){g.fillText(line,45,y);line=w;y+=43}else line+=(line?' ':'')+w}g.fillText(line,45,y);g.font='22px sans-serif';g.fillText('Together we take Christ to the Nations of the World',45,585);const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='strength-for-today.png';a.click()};
