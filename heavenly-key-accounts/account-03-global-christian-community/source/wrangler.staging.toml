name = "heavenly-key-global-community-staging"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = true
keep_vars = true
routes = []

[assets]
directory = "./public"
run_worker_first = ["/api", "/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "heavenly-key-global-community-db-staging"
database_id = "REPLACE_ACCOUNT3_STAGING_D1_ID"

[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_ACCOUNT3_STAGING_KV_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "heavenly-key-global-community-media-staging"

[vars]
PUBLIC_ORIGIN = "https://heavenly-key-global-community-staging.workers.dev"
PLATFORM_NAME = "Heavenly Key Global Christian Social Network — Staging"

[triggers]
crons = []
