plugins { id 'com.android.application' }
android {
 namespace 'org.heavenlykey.apps'
 compileSdk 35
 defaultConfig {
  applicationId 'org.heavenlykey.apps'
  minSdk 24
  targetSdk 35
  versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
  versionName '1.0.0'
 }
 signingConfigs {
  release {
   def storeFilePath = System.getenv('HKEM_ANDROID_KEYSTORE_FILE')
   if (storeFilePath) {
    storeFile file(storeFilePath)
    storePassword System.getenv('HKEM_ANDROID_KEYSTORE_PASSWORD')
    keyAlias System.getenv('HKEM_ANDROID_KEY_ALIAS')
    keyPassword System.getenv('HKEM_ANDROID_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  release {
   minifyEnabled false
   def requiredSigning = ['HKEM_ANDROID_KEYSTORE_FILE', 'HKEM_ANDROID_KEYSTORE_PASSWORD', 'HKEM_ANDROID_KEY_ALIAS', 'HKEM_ANDROID_KEY_PASSWORD']
   def missingSigning = requiredSigning.findAll { !System.getenv(it) }
   def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
   if (releaseRequested && !missingSigning.isEmpty()) {
    throw new GradleException('Production release signing is required; missing: ' + missingSigning.join(', '))
   }
   if (missingSigning.isEmpty()) signingConfig signingConfigs.release
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
