plugins { id 'com.android.application' }
android {
 namespace 'org.heavenlykey.apps'
 compileSdk 35
 defaultConfig {
  applicationId 'org.heavenlykey.apps'
  minSdk 24
  targetSdk 35
  versionCode 1
  versionName '1.0.0'
 }
 signingConfigs {
  release {
   def storeFilePath = System.getenv('HKEM_ANDROID_KEYSTORE_FILE')
   if (storeFilePath) {
    storeFile file(storeFilePath)
    storePassword System.getenv('HKEM_ANDROID_KEYSTORE_PASSWORD')
    keyAlias System.getenv('HKEM_ANDROID_KEY_ALIAS')
    keyPassword System.getenv('HKEM_ANDROID_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  release {
   minifyEnabled false
   if (System.getenv('HKEM_ANDROID_KEYSTORE_FILE')) signingConfig signingConfigs.release
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
