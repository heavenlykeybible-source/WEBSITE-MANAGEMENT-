name: HeavenlyKey
options:
  bundleIdPrefix: org.heavenlykey
targets:
  HeavenlyKey:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - HeavenlyKey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.heavenlykey.apps
        SWIFT_VERSION: 5.0
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Heavenly Key
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SUPPORTS_MACCATALYST: NO
