<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'">
<title>Heavenly Key — Private Download Statistics</title><link rel="stylesheet" href="/admin-downloads.css"></head>
<body><main><h1>Private App Download Statistics</h1><p>Administrator access only. Counts represent native package requests, not confirmed installations.</p>
<form id="auth"><label for="token">Administrator access token</label><input id="token" type="password" required minlength="32" autocomplete="off" spellcheck="false">
<button type="submit">View download counts</button></form><p id="status" role="status" aria-live="polite"></p>
<div id="report" hidden><table><caption>Native download requests by app and device</caption><thead><tr><th scope="col">App</th><th scope="col">Device</th><th scope="col">Requests</th></tr></thead><tbody id="rows"></tbody></table></div>
</main><script src="/admin-downloads.js" defer></script></body></html>
