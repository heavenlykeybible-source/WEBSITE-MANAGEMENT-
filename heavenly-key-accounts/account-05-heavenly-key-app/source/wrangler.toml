name = "heavenly-key-app"
main = "src/index.js"
compatibility_date = "2026-10-10"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true

# Account 5 hosts only public app assets and a basic health endpoint.
# Do NOT attach the original Accounts 1-4 databases or copy their credentials here.
[assets]
not_found_handling = "404-page"
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/walk-offline.html", "/walk-offline.js", "/walk-offline.css", "/walk-offline-content.js", "/offline-vault.js", "/creation-to-eternity.html", "/creation-to-eternity.js", "/creation-to-eternity.css", "/eternity-in-view", "/eternity-in-view/*"]


# Enable only after Account 3 production public APIs and policy are verified.
[vars]
INDEPENDENT_APPS_ENABLED = "true"
COMMUNITY_PUBLIC_READS_ENABLED = "true"
COMMUNITY_MEMBER_ACCESS_ENABLED = "true"
# Only read reviewed public website data. No member sessions, secrets or private routes.
SITE_PUBLIC_SYNC_ENABLED = "true"

[[services]]
binding = "WALK_APP"
service = "heavenlykey-walk-with-god"

[[services]]
binding = "BIBLE_STUDY_APP"
service = "heavenlykey-bible-study"

[[services]]
binding = "ETERNITY_APP"
service = "heavenlykey-eternity-in-view"
