<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owner sign-in | Heavenly Key Control Room</title>
<style>body{font:16px system-ui,sans-serif;background:#f4f7fc;color:#17243b;min-height:100vh;display:grid;place-items:center;margin:0}main{width:min(92vw,430px);background:white;padding:2rem;border:1px solid #d7e1ef;border-radius:16px;box-shadow:0 6px 30px #19294415}h1{margin:0 0 .75rem;font-size:1.6rem}p{line-height:1.5}label{display:block;margin:1.5rem 0 .5rem}input,button{width:100%;box-sizing:border-box;padding:.9rem;font:inherit;border-radius:8px}input{border:1px solid #879bb4}button{margin-top:1rem;background:#1c4483;color:white;border:0;cursor:pointer}button:disabled{opacity:.6}a{color:#174aa0}#status{min-height:1.5em}</style></head>
<body><main><h1>Control Room owner sign-in</h1><p>Use your existing owner password. This sign-in does not bypass Cloudflare Access or grant publishing permission.</p>
<form id="login"><label for="password">Owner password</label><input id="password" type="password" autocomplete="current-password" required maxlength="200"><button id="submit">Sign in securely</button></form>
<p id="status" role="status" aria-live="polite"></p><p><a href="/">Return to Control Room</a></p></main>
<script>
document.getElementById('login').addEventListener('submit',async event=>{
event.preventDefault();const button=document.getElementById('submit'),status=document.getElementById('status');
button.disabled=true;status.textContent='Checking your credentials…';
try{const response=await fetch('/api/owner/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});
const result=await response.json();
if(!response.ok||!result.ok)throw Error(result.error||'Sign-in failed');
document.getElementById('password').value='';location.replace('/');
}catch(e){status.textContent=e.message||'Unable to sign in.';}finally{button.disabled=false;}
});
</script></body></html>
